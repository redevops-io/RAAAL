name: Formal verification

# Its own lane because it has its own cost: a Lean toolchain is a download and
# a build, not a pip install. It does not gate every push for that reason —
# what runs everywhere is `tests/test_lean_ledger_conformance.py`, which reads
# the fixture numbers out of the Lean source and needs no toolchain.
#
# Lean failures block changes to verified deterministic operators. That is the
# point of the lane: a conservation theorem that stopped compiling and nobody
# noticed would leave the claim standing in the documentation.

on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
  pull_request:
    paths:
      - 'formal/**'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        # `pytest` only. The conformance test reads numbers out of the Lean
        # source and imports nothing from `src`, so pulling the project's
        # dependencies here would buy a slower job and no more checking.
        #
        # The first version of this workflow had no Python setup at all and
        # went straight to `python -m pytest`, which failed three runs with
        # "No module named pytest" — after a green Lean build, so the lane
        # was red for a reason that had nothing to do with the proofs.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install the toolchain the repository pins
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat formal/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: formal
        run: lake build

      - name: The fixtures agree with the Python side
        run: python -m pytest tests/test_lean_ledger_conformance.py -q
