name: Formal verification

# Its own lane because it has its own cost: a Lean toolchain is a download and
# a build, not a pip install. It does not gate every push for that reason —
# what runs everywhere is `tests/test_lean_ledger_conformance.py`, which reads
# the fixture numbers out of the Lean source and needs no toolchain.
#
# Lean failures block changes to verified deterministic operators. That is the
# point of the lane: a conservation theorem that stopped compiling and nobody
# noticed would leave the claim standing in the documentation.

on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
  pull_request:
    paths:
      - 'formal/**'
  workflow_dispatch:

# Least privilege, declared rather than inherited. The repository default is
# already `read`, but a default is a setting somebody can change in a UI
# without touching a reviewed file — and these two workflows hold a provider
# credential, so what their token may do belongs in the diff.
permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        # `pytest` only. The conformance test reads numbers out of the Lean
        # source and imports nothing from `src`, so pulling the project's
        # dependencies here would buy a slower job and no more checking.
        #
        # The first version of this workflow had no Python setup at all and
        # went straight to `python -m pytest`, which failed three runs with
        # "No module named pytest" — after a green Lean build, so the lane
        # was red for a reason that had nothing to do with the proofs.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install the toolchain the repository pins
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat formal/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib cache
        # Prebuilt oleans. Without this the job compiles Mathlib from source,
        # which is hours rather than minutes and would make the lane something
        # nobody waits for — and a verification lane nobody waits for gets
        # skipped, which is how it stops verifying.
        #
        # Mathlib is required only by `Quantify/Returns`; the lightweight core
        # still builds from a bare toolchain, and a test asserts that no core
        # module imports it.
        working-directory: formal
        run: lake exe cache get

      - name: Build
        # Both libraries. `lake build` with no target compiled nothing at all
        # in an earlier version of this file, and two mutations passed against
        # it — so the step after this one checks what was actually built.
        working-directory: formal
        run: lake build

      - name: Every module was built, not just the core
        working-directory: formal
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, sys
          built = {p.stem for p in
                   pathlib.Path(".lake/build/lib/Quantify").rglob("*.olean")}
          source = {p.stem for p in pathlib.Path("Quantify").rglob("*.lean")}
          missing = sorted(source - built)
          print("## Formal\n")
          for name in sorted(built):
              print(f"- built `{name}`")
          if missing:
              print(f"\n**not built: {missing}**")
              sys.exit(1)
          PY

      - name: The fixtures agree with the Python side
        run: python -m pytest tests/test_lean_ledger_conformance.py -q
