name: Daily Backtest & Deploy

on:
  schedule:
    # Three daily attempts spaced ~5h apart so the workflow still lands
    # when the self-hosted runner host is offline for part of the day.
    # The precheck job below ensures only one successful deploy per day.
    - cron: '0 6 * * *'   # 06:00 UTC (~1-2 AM ET)
    - cron: '0 11 * * *'  # 11:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC

  workflow_dispatch:

  push:
    branches:
      - master

# Only one workflow run pending or in-flight at a time. When a newer
# scheduled run arrives, GitHub cancels the previously-pending one — so
# if the self-hosted host stays offline through 06:00 and 11:00, the
# 16:00 attempt is the one that ends up queued for the runner.
concurrency:
  group: daily-deploy
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if a successful run already deployed today
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Non-scheduled trigger; proceeding regardless of prior runs."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          count=$(gh run list \
            --workflow=daily-deploy.yml \
            --status=success \
            --created=">=${today}" \
            --json databaseId \
            --jq 'length')
          if [ "${count:-0}" -gt 0 ]; then
            echo "A successful run already completed today (count=${count}); skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run today; queuing self-hosted job."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  backtest-and-deploy:
    needs: [precheck]
    if: needs.precheck.outputs.should_deploy == 'true'
    runs-on: self-hosted
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
            # Force the workflow to run off the canonical main branch so the
            # resulting Pages deployment goes to the production environment.
              ref: master
      
      - name: Set up Python virtualenv
        run: |
          python3 -m venv .venv --clear
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # Gates the deploy on correctness. The leakage regression tests in
        # tests/test_leakage.py guard the Release 0 fixes (execution lag,
        # transaction costs, model-cutoff enforcement, determinism); without
        # this step they could silently regress into a published dashboard.
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q

      - name: Purge persisted data caches
        # Self-hosted workspaces persist between runs; stale parquet/yfinance
        # caches have silently truncated the dashboard's date range before.
        # Wipe the per-ticker cache and the joined history outputs so
        # `--refresh` re-downloads everything from scratch each run.
        # data/models must go too: it previously survived, so a regime model
        # trained on the full timeline by the dashboard was reloaded at the start
        # of the next backtest and used to classify every historical date.
        run: |
          rm -rf data/cache data/history data/models
          rm -rf "${HOME}/.cache/py-yfinance"

      - name: Run historical backtest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          . .venv/bin/activate
          python -m src.history \
            --start 2016-01-01 \
            --end $(date +%Y-%m-%d) \
            --refresh \
            --use-forecaster \
            --use-sentiment \
            --sentiment-backend auto
      
      - name: Build dashboard
        run: |
          . .venv/bin/activate
          echo "Building dashboard from historical data..."
          python -m src.visualization.bokeh_app
          echo "Dashboard build completed"
          ls -lh reports/regime_dashboard.html
          cp reports/regime_dashboard.html reports/index.html
          echo "Dashboard files ready for deployment:"
          ls -lh reports/*.html
      
      - name: Verify data freshness
        run: |
          . .venv/bin/activate
          python -c "
          import pandas as pd
          from pathlib import Path
          prices = pd.read_parquet('data/history/prices.parquet')
          timeline = pd.read_parquet('data/history/timeline.parquet')
          print(f'Price data range: {prices.index.min().date()} to {prices.index.max().date()}')
          print(f'Timeline range: {timeline.index.min().date()} to {timeline.index.max().date()}')
          print(f'Dashboard size: {Path(\"reports/regime_dashboard.html\").stat().st_size / 1024 / 1024:.2f} MB')
          "
      
      - name: Publish research artifacts to the live app volume
        # The live investment-agent (quantify.club) serves the console at / and the nightly Bokeh
        # dashboard at /research from mounted volumes. Instead of Cloudflare Pages, sync the freshly
        # built dashboard + parquet history to the host paths the container mounts, then restart it so
        # the objective columns + /research reflect today's data. Guarded so a missing path/compose
        # never fails the run (the app falls back to a synthetic snapshot if the parquet is absent).
        env:
          RAAAL_DEPLOY_DIR: ${{ secrets.RAAAL_DEPLOY_DIR }}      # e.g. /projects/RAAAL on the proxmox host
          COMPOSE_FILE: ${{ secrets.INTEGRATED_COMPOSE_FILE }}   # e.g. /projects/agentic-os-stack/integrated.compose.yml
        run: |
          set -e
          if [ -z "${RAAAL_DEPLOY_DIR}" ]; then
            echo "RAAAL_DEPLOY_DIR not set — skipping live publish (research artifacts still built + uploaded)."
            exit 0
          fi
          echo "Syncing research artifacts to ${RAAAL_DEPLOY_DIR} ..."
          mkdir -p "${RAAAL_DEPLOY_DIR}/reports" "${RAAAL_DEPLOY_DIR}/data/history"
          rsync -a --delete reports/ "${RAAAL_DEPLOY_DIR}/reports/"
          rsync -a data/history/ "${RAAAL_DEPLOY_DIR}/data/history/"
          if [ -n "${COMPOSE_FILE}" ] && command -v docker >/dev/null 2>&1; then
            echo "Restarting investment-agent to pick up fresh artifacts ..."
            docker compose -f "${COMPOSE_FILE}" up -d --no-deps investment-agent || \
              echo "investment-agent restart skipped (service not in compose yet — see deploy/DEPLOY.md)."
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-${{ github.sha }}
          path: reports/regime_dashboard.html
          retention-days: 30

