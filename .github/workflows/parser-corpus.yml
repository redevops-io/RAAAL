name: Parser corpus

# Two jobs, because the corpus has two costs.
#
#   corpus    reads recorded parses. Seconds. Runs on every push.
#   parser    loads the real Stanza model and diffs it against those
#             recordings. Minutes and ~500MB. Runs on a schedule, on changes
#             to the parser layer, and on demand.
#
# Splitting them is the point. A single job that needed the model would be one
# nobody runs locally and everybody skips in CI, and a corpus whose recordings
# are never checked against the parser is a corpus measuring a snapshot of
# whatever the fixtures happen to say.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly. A parser upgrade is the thing that moves an attachment, and that
    # happens on release cycles rather than on commits.
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Least privilege, declared rather than inherited. The repository default is
# already `read`, but a default is a setting somebody can change in a UI
# without touching a reviewed file — and these two workflows hold a provider
# credential, so what their token may do belongs in the diff.
permissions:
  contents: read

concurrency:
  group: parser-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: corpus (recorded parses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements-core.txt

      - name: Tier 1, tier 2 and the corpus invariants
        run: |
          python -m pytest -q \
            tests/test_parser_corpus.py \
            tests/test_syntax_normalisation.py \
            tests/test_syntax_attachment.py \
            tests/test_real_phrasings.py \
            tests/test_fusion.py \
            tests/test_binding.py \
            tests/test_semantics.py \
            tests/test_closure.py \
            tests/test_pipeline.py

      - name: The generators and the files agree
        # The JSON is the artifact and the builder is how it is made. A
        # hand-edited fixture is how a corpus stops describing its own rules —
        # and for the attested pack it is also how an invented sentence
        # acquires a source link it never had.
        run: |
          for pair in "cases:build_cases" "real_phrasings:real_phrasings" "closure:closure"; do
            name="${pair%%:*}"; builder="${pair##*:}"
            cp "corpus/parser/${name}.json" "/tmp/${name}.committed.json"
            python "corpus/parser/${builder}.py"
            diff -u "/tmp/${name}.committed.json" "corpus/parser/${name}.json" || {
              echo "::error::${name}.json does not match ${builder}.py —"\
                   "regenerate it rather than editing it by hand"
              exit 1
            }
          done

  parser:
    name: parser (live Stanza)
    runs-on: ubuntu-latest
    # Not a required check. A model download failing upstream must not block a
    # merge that has nothing to do with the parser; it must be visible, which
    # is what a scheduled red job is for.
    continue-on-error: true
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[parser]') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest stanza
          pip install -r requirements-core.txt

      - name: Cache the Stanza models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/stanza_resources
          key: stanza-en-${{ hashFiles('corpus/parser/parses.json') }}
          restore-keys: stanza-en-

      - name: Fetch the English model
        run: python -c "import stanza; stanza.download('en', verbose=False)"

      - name: The recordings still match the parser
        run: python -m pytest -q tests/test_parse_fixtures_are_current.py

      - name: Show what drifted
        if: failure()
        run: |
          echo "A recorded parse no longer matches the live parser."
          echo "Re-record with: python corpus/parser/record_parses.py"
          echo "Then read the diff — a changed attachment is a changed reading."

  # Already restricted to `schedule` and `workflow_dispatch` below, both of
  # which require write access. A pull request — fork or not — never reaches
  # this job, so a missing secret here is a real fault rather than the
  # ordinary condition of an outside contribution. That is what lets the step
  # below fail hard instead of apologising.
  model-drift:
    name: model drift (live hosted reader, small subset)
    runs-on: ubuntu-latest
    # Never a required check, and never on push. The corpus replays recordings;
    # this lane exists only to notice that the provider's answer has moved. A
    # red here is information, not a broken build.
    continue-on-error: true
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install openai
          pip install -r requirements-core.txt

      - name: Re-ask a deterministic subset and diff against the recordings
        env:
          QUANTIFY_PARSER_PROVIDER: OPENAI
          QUANTIFY_PARSER_MODEL: gpt-4.1-2025-04-14
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Named, not silent. This step mapped ANTHROPIC_API_KEY, which was
          # never configured, so it took this branch on every run it has ever
          # had — a check that has never executed and reported success each
          # time. A fork pull request still lands here, because GitHub does
          # not give forks secrets, and that case is legitimate; a missing
          # secret on a run that *should* have one is not, and the two now
          # read differently in the log.
          if [ -z "$OPENAI_API_KEY" ]; then
            # A job whose whole purpose is a live call, finishing green
            # without making one, is a tick for work that did not happen.
            # `::error::` plus a non-zero exit is the only rendering GitHub
            # offers that cannot be mistaken for evidence — a fork pull
            # request legitimately has no secret, so this job is excluded
            # from those by its `if:` rather than by exiting quietly here.
            echo "::error::OPENAI_API_KEY is absent, so the live subset was"\
                 "NOT re-asked. This job exists to make a provider call and"\
                 "has not made one; a green result here would be vacuous."
            exit 1
          fi
          cp corpus/parser/hosted.json /tmp/hosted.recorded.json
          python corpus/parser/record_hosted.py --subset 8 --refresh
          if diff -q /tmp/hosted.recorded.json corpus/parser/hosted.json; then
            echo "the model still answers as recorded"
          else
            echo "::warning::the hosted reader's answers have moved."\
                 "Read the diff before re-recording — a changed reading is a"\
                 "changed meaning, not a formatting change."
            diff -u /tmp/hosted.recorded.json corpus/parser/hosted.json | head -120
            exit 1
          fi
