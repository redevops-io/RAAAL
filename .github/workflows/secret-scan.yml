name: secret-scan
# Detects committed secrets with the gitleaks BINARY (free; no org license needed — the gitleaks Action
# requires a paid license for organizations, the binary does not). --redact guarantees no secret VALUE is ever
# printed in logs. Added by the compliance hardening pass as the plan-independent substitute for GitHub's
# native secret scanning, which is a paid add-on on private repos. A failing run means a real secret is
# committed: rotate it and purge it from history.
#
# Dispatch-only, like every other lane in this directory — the decision recorded in
# `tests/test_workflows_do_not_fire_by_themselves.py`. This one shipped with `on: push`/`pull_request`/
# `schedule` and an unpinned `actions/checkout@v4`, and startup-failed on every event because the org
# requires actions pinned to a full commit SHA (every other workflow here pins one). So it gated nothing
# while showing a red cross on every push — exactly the noise the dispatch-only policy exists to prevent.
# The way to make it gate pushes/PRs is a trigger below AND a matching line in that test, in one diff.
#
#   push:
#     branches: [master]
#   pull_request:
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (redacted)
        run: |
          set -euo pipefail
          ver="$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                 | grep -oP '"tag_name": *"v\K[^"]+')"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
                 | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
