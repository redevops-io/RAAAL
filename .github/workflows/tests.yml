name: Tests

# The suite has no automatic trigger, and that is deliberate — the same
# decision every other workflow here records.
#
# This lane was added with `on: push` and `pull_request`, referencing a
# `requirements-dev.txt` that does not exist. So it failed at the install step
# on every push, which is a red cross against a green suite: the code was fine
# and the lane was wrong. That is precisely the failure mode the other
# workflows in this directory were switched off for, and it took one afternoon
# to reintroduce.
#
# Kept runnable rather than deleted. The lanes below are real evidence and the
# way to turn them on is to restore a trigger here — with a working install
# line, and having watched it pass from a dispatch first:
#
#   push:
#     branches: [master]
#   pull_request:
#
# `tests/test_workflows_do_not_fire_by_themselves.py` asserts this file has no
# automatic trigger, so switching one on is a decision somebody makes in a diff
# rather than a side effect of adding a lane.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: fast lane (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      # `requirements.txt`, which carries pytest. The first version of this
      # file installed `requirements-core.txt -r requirements-dev.txt`; the
      # second of those has never existed in this repository.
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --ignore=tests/test_container_reachability.py

  postgres:
    name: persistence lane (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Why this lane exists at all. SQLite is fast and cannot express the
    # guarantees that matter most here: `row[0]` is correct on `sqlite3.Row`
    # and a `KeyError` on a mapping-only row, so a defect that returned
    # INTERNAL_ERROR on every saved plan passed every test; a primary key can
    # be moved on PostgreSQL and not on SQLite, so a migration can be
    # half-applied and green; and the digest that says which observations
    # produced a figure is only checked against a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantify
        ports: ['5432:5432']
        # Without this the suite starts before the database accepts
        # connections, every PostgreSQL test skips for want of a URL that is
        # set, and the lane reports green having checked nothing.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      QUANTIFY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/quantify
      # A skip is a failure here. `tests/conftest.py` refuses to start without
      # a database, fails the run on any test skipped for want of one, and
      # checks by name that each PostgreSQL-only guarantee actually executed —
      # a test can leave collection without ever reporting a skip.
      QUANTIFY_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --ignore=tests/test_container_reachability.py
