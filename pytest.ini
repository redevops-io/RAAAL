[pytest]
testpaths = tests

# The licensed tier is opt-in. Without this the market-data integration tests
# run in every ordinary invocation and fail for want of credentials nobody
# asked for — and a suite that fails by default is a suite people stop reading.
#
# A command-line -m overrides this one, so the tier is reached with:
#
#     pytest -m market_data_integration
#
addopts = -m "not market_data_integration"

markers =
    market_data_integration: runs against the licensed market-data snapshot.
        Requires credentials and network. Fails rather than skips when
        explicitly requested, because a silent skip in the tier that exists to
        check the real data is indistinguishable from a pass.
