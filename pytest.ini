[pytest]
testpaths = tests

# The licensed tier is opt-in. Without this the market-data integration tests
# run in every ordinary invocation and fail for want of credentials nobody
# asked for — and a suite that fails by default is a suite people stop reading.
#
# A command-line -m overrides this one, so the tier is reached with:
#
#     pytest -m market_data_integration
#
addopts = -m "not market_data_integration and not model_stage1"

markers =
    container: builds and runs the real production image. Slow, needs Docker
        and a reachable PostgreSQL. This is the only lane that can see which
        CMD the image has — an in-process test cannot, which is why the
        container served a dashboard while the pilot API went unserved.
    model_stage1: exercises model-assisted compiler stage 1 against a live API.
        Requires ANTHROPIC_API_KEY and network. Opt-in with
        `pytest -m model_stage1`, because a default suite that calls a model is
        nondeterministic, billable, and different on every machine.
    real_parser_client: needs the unstubbed `_parser_client` to check which
        parser a declared mode selects. Runs in the default suite: it reaches
        the function, never a model, and the condition under test is usually
        the absence of a key. Distinct from `model_stage1`, which is opt-in
        because it calls a live API.
    market_data_integration: runs against the licensed market-data snapshot.
        Requires credentials and network. Fails rather than skips when
        explicitly requested, because a silent skip in the tier that exists to
        check the real data is indistinguishable from a pass.
