spec_version: '0.1'
name: long-warmup
version: 1
title: Long-warmup evaluation (504-day estimation windows)

change_rationale: >-
  Created after protocol/standard@1 was refused for methodology/hrp@3: a 252-day
  warmup is shorter than that methodology's 504-day lookback, which would push
  early evaluation dates onto the fallback allocation rule while still reporting
  them as the methodology.

  Identical to standard@1 except for warmup. Kept as a separate protocol rather
  than a revision of standard@1 so that results measured under the 252-day warmup
  remain citable and comparable among themselves.

