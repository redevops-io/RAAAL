spec_version: '0.1'
name: sealed
version: 1
title: Sealed-holdout evaluation (2022-01-01 onward)

change_rationale: >-
  Initial publication. Reserves 2022-01-01 onward as a sealed out-of-sample
  window. The runner refuses to read the sealed period, so a result measured
  under this protocol is in-sample by construction until the holdout is opened by
  a logged unlock event — once, and recorded.

  This is the mechanism-level answer to backtest overfitting: it converts an
  honour-system norm ("we didn't peek") into an enforced control that leaves an
  audit trail either way.

