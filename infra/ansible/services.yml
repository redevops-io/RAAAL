# Deploy the Quantify services to Kubernetes.
#
#   ansible-playbook services.yml -e service=data
#   ansible-playbook services.yml            # every service in order
#
# **Runs locally, against the cluster API.** There is no host to reach: the
# thing being configured is a control plane, not a machine. This is now the
# only deployment path; the EC2 one it ran alongside during the migration is in
# `archive/ec2-deployment/` and has nothing left to deploy to.
#
# **The database password is never read.** It is fetched from a sensitive
# terraform output with `no_log`, handed to the cluster Secret, and never
# printed, never written to a variables file, never placed in
# `ansible_variables` — that output is written to disk, and a password in it is
# a password in a file nobody remembered to delete. If this playbook is run
# with `-vvv` the value still does not appear.
#
# **A rollout is not a deployment.** The last task asks the service what it is
# and refuses a pod that is running but wrong: `kubectl rollout status`
# reporting success means Kubernetes is satisfied, which is a different claim
# from the service answering correctly.
---
- name: Deploy Quantify services to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
    # `namespace` is reserved in Ansible; a variable using it can be shadowed
    # by the engine's own, which is a class of bug that appears only under some
    # execution paths.
    k8s_namespace: quantify
    service: all
    # Which services this playbook knows, in the order they may be deployed.
    # Data first: evaluate is configured with its URL and has nothing to talk
    # to until it exists.
    known_services: [data, identity, evaluate, web, tunnel]

  tasks:
    - name: Require a cluster to deploy to
      ansible.builtin.command:
        cmd: terraform output -raw eks_cluster_name
        chdir: "{{ terraform_dir }}"
      register: cluster
      changed_when: false
      failed_when: cluster.rc != 0 or cluster.stdout | trim == ""

    - name: Point kubectl at it
      ansible.builtin.command:
        cmd: >-
          aws eks update-kubeconfig --region {{ region | default('us-east-1') }}
          --name {{ cluster.stdout | trim }}
      changed_when: false

    - name: Read the image this deployment pins
      ansible.builtin.command:
        cmd: terraform output -json ansible_variables
        chdir: "{{ terraform_dir }}"
      register: tfvars
      changed_when: false
      check_mode: false

    - name: Name what is being deployed
      ansible.builtin.set_fact:
        image: "{{ (tfvars.stdout | from_json).quantify_image }}"
        build_commit: "{{ (tfvars.stdout | from_json).quantify_build_commit }}"
        database_host: "{{ (tfvars.stdout | from_json).quantify_database_host }}"
        domain: "{{ (tfvars.stdout | from_json).quantify_domain }}"
        identity_domain: "{{ (tfvars.stdout | from_json).quantify_identity_domain }}"
        snapshot_id: "{{ (tfvars.stdout | from_json).quantify_build_snapshot_id }}"
        release_ref: "{{ (tfvars.stdout | from_json).quantify_build_release_ref }}"
        parser_mode: "{{ (tfvars.stdout | from_json).quantify_parser_mode }}"
        parser_model: "{{ (tfvars.stdout | from_json).quantify_parser_model }}"
        parser_provider: "{{ (tfvars.stdout | from_json).quantify_parser_provider }}"
        parser_fallback: "{{ (tfvars.stdout | from_json).quantify_parser_fallback }}"
        # Mirrors `PROVIDER_KEY_VARS` in src/deploy/context.py. Computed here
        # so the Secret's key is a single-line expression: a multi-line Jinja
        # mapping key is not YAML Ansible will parse, and it failed the whole
        # playbook rather than that one line.
        model_key_var: "{{ 'OPENAI_API_KEY'
                           if (tfvars.stdout | from_json).quantify_parser_provider == 'OPENAI'
                           else 'ANTHROPIC_API_KEY' }}"
        # `ingress` is a target and not a service: it deploys nothing, it
        # publishes what is already deployed. Kept selectable on its own so the
        # routing can be changed without restarting an identity provider that
        # is serving sessions.
        targets: "{{ known_services + ['ingress'] if service == 'all'
                     else service | split(',') }}"

    - name: Refuse a service this playbook does not know
      ansible.builtin.assert:
        that: targets | difference(known_services + ['ingress']) | length == 0
        fail_msg: >-
          {{ targets | difference(known_services + ['ingress']) }} is not a
          service here.
          Deploying by a name nobody declared would apply a manifest that does
          not exist and report success.

    - name: The namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"
        state: present

    # --- the credential ----------------------------------------------------
    #
    # Fetched and handed over without being seen. `no_log` covers both tasks:
    # the read, because the value is in stdout, and the write, because the
    # value is in the task arguments.
    - name: Fetch the database URL
      ansible.builtin.command:
        cmd: terraform output -raw database_url
        chdir: "{{ terraform_dir }}"
      register: database_url
      changed_when: false
      no_log: true
      when: targets | intersect(['data', 'web']) | length > 0

    - name: Refuse an empty credential rather than deploying without one
      ansible.builtin.assert:
        that: database_url.stdout | length > 20
        fail_msg: >-
          the database URL output is empty or too short to be a connection
          string. A service deployed with a blank credential comes up, fails
          every request, and reports as running.
        success_msg: "a database URL was produced (value not shown)"
      when: targets | intersect(['data', 'web']) | length > 0

    - name: Give quantify-data its database URL
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: quantify-data
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData:
            database_url: "{{ database_url.stdout | trim }}"
        state: present
      no_log: true
      when: "'data' in targets"

    # --- the other credentials ---------------------------------------------
    #
    # Fetched from Secrets Manager, not from terraform outputs and not from a
    # file. Each read and each write carries `no_log`: the value is in stdout
    # for one and in task arguments for the other, and `-vvv` must not turn a
    # deploy log into a credential store.
    - name: Fetch the runtime secrets
      ansible.builtin.command:
        cmd: >-
          aws secretsmanager get-secret-value --region {{ region | default('us-east-1') }}
          --secret-id {{ item.id }} --query SecretString --output text
        chdir: "{{ terraform_dir }}"
      register: fetched
      changed_when: false
      # A value-less secret is not a deploy failure. `client_id` exists as an
      # empty shell before its OIDC application is bootstrapped — the identity
      # deploy that mints it must be able to run while it is still empty — and
      # `get-secret-value` returns ResourceNotFoundException for the value, not
      # the secret. Treat that as an empty value and let the target-aware
      # blank-check below decide whether this run actually needed it. Bad
      # credentials empty every fetch, and that check catches them by name.
      failed_when: false
      no_log: true
      loop:
        - { name: db_password,    id: "quantify-test/database-password" }
        - { name: masterkey,      id: "quantify-test/identity-masterkey" }
        - { name: admin_password, id: "quantify-test/identity-admin-password" }
        - { name: client_id,      id: "quantify-test/identity-client-id" }
        - { name: tunnel_token,   id: "quantify-test/cloudflare-tunnel-token" }
      when: targets | intersect(['identity', 'web', 'tunnel']) | length > 0

    - name: Name them without showing them
      ansible.builtin.set_fact:
        secret: "{{ dict(fetched.results | map(attribute='item.name')
                    | zip(fetched.results | map(attribute='stdout'))) }}"
      no_log: true
      when: targets | intersect(['identity', 'web', 'tunnel']) | length > 0

    # Which credentials this run actually needs, by target. `client_id` is the
    # subtle one: it does not exist until identity has been deployed and its OIDC
    # application bootstrapped, so requiring it for the identity deploy would fail
    # on the value that deploy exists to mint. web needs it; identity does not.
    - name: Which secrets this run requires
      ansible.builtin.set_fact:
        required_secrets: "{{ ((['db_password', 'masterkey', 'admin_password'] if 'identity' in targets else [])
                               + (['db_password', 'client_id'] if 'web' in targets else [])) | unique }}"
      when: targets | intersect(['identity', 'web', 'tunnel']) | length > 0

    - name: Refuse blanks rather than deploying them
      ansible.builtin.assert:
        that: secret[item] | default('') | length > 4
        fail_msg: >-
          {{ item }} came back empty. A service deployed with a blank
          credential comes up, fails every request, and reports as running —
          and for the identity master key it would come up unable to decrypt
          anything already stored.
      loop: "{{ required_secrets | default([]) }}"
      # The model key is not here: it comes from the environment, not Secrets
      # Manager, and is checked as the application will read it, below.
      no_log: true

    # Checked as the connector will read it, not as it is stored. A length
    # test on the JSON wrapper says nothing about the credential inside, and
    # the failure it misses is a connector that starts, is refused by
    # Cloudflare, and crash-loops behind a Deployment that reports 0/2 with no
    # hint as to why.
    - name: Refuse a tunnel token that is not one
      ansible.builtin.assert:
        that:
          - secret.tunnel_token | from_json | type_debug == 'dict'
          - (secret.tunnel_token | from_json).token | default('') | length > 100
        fail_msg: >-
          the tunnel token secret does not contain a usable `token`. The
          connector is the only ingress path, so deploying this would take
          every hostname down rather than degrade one service.
      no_log: true
      when: "'tunnel' in targets"

    # The connector's credential. It is the whole tunnel — anybody holding it
    # can register a connector and receive traffic for these hostnames — so it
    # travels the same never-printed path as the database password.
    - name: Give quantify-tunnel its token
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: quantify-tunnel, namespace: "{{ k8s_namespace }}" }
          stringData:
            # `.token`, not the secret body. Secrets Manager holds this as a
            # JSON object and the connector wants the bare credential — the
            # same shape that made Zitadel refuse a 48-byte master key that
            # was really a 32-byte one wrapped in JSON. The length assert
            # above passed happily on the wrapper, which is why it now checks
            # the extracted value instead.
            TUNNEL_TOKEN: "{{ (secret.tunnel_token | from_json).token }}"
        state: present
      no_log: true
      when: "'tunnel' in targets"

    - name: Give quantify-identity what Zitadel needs
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: quantify-identity, namespace: "{{ k8s_namespace }}" }
          type: Opaque
          stringData:
            # The stored secret is a JSON document; Zitadel wants the 32-byte
            # key inside it. Passing the document gave "masterkey must be 32
            # bytes, but is 48" — which is the good failure: a master key of
            # the wrong length is refused at startup rather than accepted and
            # used to decrypt nothing.
            ZITADEL_MASTERKEY: "{{ (secret.masterkey | from_json).masterkey }}"
            # The same issuer it already publishes. Changing it would
            # invalidate every token in circulation and every stored redirect.
            ZITADEL_EXTERNALDOMAIN: "{{ identity_domain | default('auth.quantify.club') }}"
            ZITADEL_EXTERNALPORT: "443"
            ZITADEL_EXTERNALSECURE: "true"
            ZITADEL_DATABASE_POSTGRES_HOST: "{{ database_host }}"
            ZITADEL_DATABASE_POSTGRES_PORT: "5432"
            ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
            ZITADEL_DATABASE_POSTGRES_USER_USERNAME: quantify
            ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "{{ secret.db_password }}"
            ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: require
            ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: quantify
            ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "{{ secret.db_password }}"
            ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: require
            # First-instance bootstrap. Applied only when Zitadel initialises a
            # fresh database (start-from-init with no instance yet); a no-op once
            # an instance exists. Creates the org, the admin — with the
            # terraform-generated password, so no credential is invented here —
            # and the deploy-bootstrap machine user whose PAT is written to
            # /machinekey/pat.txt for the OIDC application bootstrap to use.
            ZITADEL_FIRSTINSTANCE_ORG_NAME: Quantify
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "{{ (secret.admin_password | from_json).password }}"
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
            ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: deploy-bootstrap
            ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Deployment bootstrap
            ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
            ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
            # The SMTP sender token, for the bootstrap sidecar to point Zitadel
            # at Postmark so the hosted register flow can deliver its
            # verification code — without a sender, a self-registered user is
            # stranded on the screen that both verifies the address and sets the
            # password. From the environment, like the model key: the operator's
            # shell exports it, and it is the same token that already sends for
            # this domain. Empty disables SMTP wiring rather than failing — a
            # deployment with no sender is a valid one that simply cannot
            # self-register users.
            POSTMARK_TOKEN: "{{ lookup('env', 'POSTMARK_API_TOKEN') }}"
        state: present
      no_log: true
      when: "'identity' in targets"

    # The OIDC bootstrap script, mounted into the identity pod's bootstrap
    # sidecar from a ConfigMap. Rendered here from the file so scripts/ stays the
    # one source of truth — the sidecar reads FIRSTINSTANCE's PAT from a volume no
    # other pod can reach, mints the OIDC application, and prints its client id,
    # which then goes into Secrets Manager for the web deploy to consume.
    - name: Render the identity bootstrap script into a ConfigMap
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: quantify-identity-bootstrap
            namespace: "{{ k8s_namespace }}"
          data:
            bootstrap_identity.py: "{{ lookup('file', playbook_dir + '/../../scripts/bootstrap_identity.py') }}"
            configure_smtp.py: "{{ lookup('file', playbook_dir + '/../../scripts/configure_smtp.py') }}"
        state: present
      when: "'identity' in targets"

    # The model key, from the environment, under the name the declared provider
    # reads.
    #
    # Sourced from the environment (`OPENAI_API_KEY` for an OPENAI deployment,
    # `ANTHROPIC_API_KEY` for an ANTHROPIC one — `model_key_var` names it) rather
    # than from Secrets Manager: the operator's shell already exports it, and
    # routing it through a Secrets Manager value the deploy would have to place
    # by hand first is a step that adds no safety here. The name still tracks the
    # declared provider, because the fault it guards against — the key going into
    # a variable the application never reads — is the same either way.
    #
    # Merged in rather than written as a templated mapping key. Ansible does not
    # resolve a Jinja expression used as a key inside `definition`, and the
    # failure is a censored task with `no_log` on it — a dict built here and
    # combined is both readable and debuggable.
    - name: Refuse an empty model key rather than a server that cannot parse
      ansible.builtin.assert:
        that: lookup('env', model_key_var) | length > 20
        fail_msg: >-
          {{ model_key_var }} is not set in the environment. The web service
          reads the model key under that name and its preflight refuses to serve
          without it, so this would deploy a server that comes up and cannot parse.
      when: "'web' in targets"

    - name: Name the model key as its provider reads it
      ansible.builtin.set_fact:
        model_key_env: "{{ {model_key_var: lookup('env', model_key_var)} }}"
      no_log: true
      when: "'web' in targets"

    - name: Give quantify-web its configuration
      vars:
        web_config:
          QUANTIFY_DATABASE_URL: "{{ database_url.stdout | trim }}"
          QUANTIFY_DEPLOYMENT_PROFILE: production
          PILOT_DATA_POLICY: market-data-egress/pilot-vendor-approved@1
          # Read from terraform, not written here. These were literals —
          # MODEL_ASSISTED and claude-sonnet-5 — while terraform declared
          # RUNTIME and gpt-5.4, so the deployment served one interpreter
          # while every plan and cost report described another. Not
          # cosmetic: `/workspace/new` serves a different template, form
          # and route depending on it, so the path being tested was not
          # the path being served. `deploy.context` exists so one place
          # decides which reader a deployment uses; a playbook writing its
          # own answer is a second place, and this is what that produces.
          QUANTIFY_PARSER_MODE: "{{ parser_mode }}"
          QUANTIFY_PARSER_MODEL: "{{ parser_model }}"
          QUANTIFY_PARSER_PROVIDER: "{{ parser_provider }}"
          QUANTIFY_PARSER_FALLBACK: "{{ parser_fallback }}"
          # The issuer stays what it is. `iss` is checked on every token
          # and is published in discovery, so this is not a value to tidy.
          OIDC_ISSUER: "https://{{ identity_domain | default('auth.quantify.club') }}"
          OIDC_CLIENT_ID: "{{ secret.client_id }}"
          OIDC_AUDIENCE: "{{ secret.client_id }}"
          OIDC_INTERNAL_BASE_URL: "http://quantify-identity"
          PUBLIC_BASE_URL: "https://{{ domain | default('quantify.club') }}"
          QUANTIFY_COMMIT: "{{ build_commit }}"
          QUANTIFY_IMAGE_DIGEST: "{{ image | regex_search('sha256:[0-9a-f]+') }}"
          QUANTIFY_SNAPSHOT_ID: "{{ snapshot_id }}"
          QUANTIFY_RELEASE_REF: "{{ release_ref }}"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: quantify-web, namespace: "{{ k8s_namespace }}" }
          type: Opaque
          # Merged, because the model key's *name* depends on the declared
          # provider and Ansible does not resolve a Jinja expression used
          # as a mapping key inside `definition` — it fails as a censored
          # task with `no_log` on it, which is a bad way to learn that.
          stringData: "{{ web_config | combine(model_key_env) }}"
        # Replaced, not merged. `state: present` patches, so a key written by
        # an earlier deploy survives under its old name: switching the declared
        # provider from ANTHROPIC to OPENAI left ANTHROPIC_API_KEY in place
        # holding a key for the other provider. Nothing reads it today, and the
        # day something does it finds a credential that looks configured and is
        # not. Inside the module arguments, not beside them — at task level it
        # is a conflicting action statement and the play does not run.
        force: true
      no_log: true
      when: "'web' in targets"

    # The migration Job runs under the quantify-data service account — the schema
    # owner's identity. On a first bring-up that account does not exist yet:
    # data.yaml creates it, and data.yaml is applied *after* the migration, so the
    # Job's pod is forbidden ("serviceaccount quantify-data not found") and the
    # wait hangs on a Job that can never start. Create the account here, before the
    # Job borrows it; data.yaml re-applies the same object idempotently. The Pod
    # Identity association in terraform binds by name, so it attaches the moment
    # this exists.
    - name: Ensure the quantify-data service account exists before the migration
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: quantify-data
            namespace: "{{ k8s_namespace }}"
        state: present
      when: "'data' in targets"

    - name: Render the migration Job for this build
      ansible.builtin.set_fact:
        migration_job: >-
          {{ lookup('file', playbook_dir + '/../../deploy/kubernetes/migrate.yaml')
             | replace('IMAGE_PLACEHOLDER', image)
             | replace('COMMIT_SHORT_PLACEHOLDER', build_commit[:8]) }}
      when: "'data' in targets"

    - name: Migrate
      kubernetes.core.k8s:
        definition: "{{ migration_job | from_yaml }}"
        state: present
      when: "'data' in targets"

    - name: Wait for the migration to finish
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} wait --for=condition=complete
          job/quantify-migrate-{{ build_commit[:8] }} --timeout=10m
      changed_when: false
      when: "'data' in targets"

    # The Job's completion is the gate; its log is commentary.
    #
    # The first version asserted on the log and broke: the Job reported
    # Complete and its pod was gone, because Auto Mode had consolidated the
    # node it ran on. A completed pod is not durable and `kubectl logs job/…`
    # then waits for one that will never appear.
    #
    # The evidence was never really the log. The Job asserts `AT_HEAD` itself
    # and exits non-zero when the database is not at this build's head, so
    # `wait --for=condition=complete` succeeding already carries that fact —
    # and carries it whether or not anything survived to be read. Gating on
    # the transcript made a durable check depend on a transient artifact.
    - name: Read what it did, if the pod is still around to say
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} logs
          job/quantify-migrate-{{ build_commit[:8] }}
      register: migration
      changed_when: false
      failed_when: false
      when: "'data' in targets"

    - name: What the migration reported
      ansible.builtin.debug:
        msg: >-
          {{ migration.stdout_lines | select('search', '=') | list
             if (migration.stdout | default('')) else
             'the Job completed; its pod is gone, so there is no transcript.
              Completion is the assertion — the Job exits non-zero unless the
              database is at this build head.' }}
      when: "'data' in targets"

    # --- the workloads -----------------------------------------------------

    - name: Render each manifest with the pinned image
      ansible.builtin.set_fact:
        rendered: >-
          {{ rendered | default({}) | combine({
            item: lookup('file', playbook_dir + '/../../deploy/kubernetes/' + item + '.yaml')
                  | replace('IMAGE_PLACEHOLDER', image)
                  | replace('COMMIT_PLACEHOLDER', build_commit)
                  | replace('DIGEST_PLACEHOLDER', image | regex_search('sha256:[0-9a-f]+') | default('', true))
          }) }}
      loop: "{{ targets | intersect(known_services) }}"

    - name: Apply
      kubernetes.core.k8s:
        definition: "{{ rendered[item] | from_yaml_all | list }}"
        state: present
      loop: "{{ targets | intersect(known_services) }}"

    # A Secret change does not restart anything.
    #
    # `envFrom` injects at pod start, so updating a Secret leaves every running
    # pod on the old values while `kubectl get secret` shows the new ones — and
    # the deployment reports success because nothing about the Deployment
    # changed. That is how a corrected master key sat in the cluster for five
    # minutes while the pod kept failing on the old one.
    #
    # Restarting unconditionally is the honest cost: a deploy that re-applies
    # identical secrets restarts pods it did not need to, which is cheap and
    # visible, where the alternative is a config change that silently does not
    # take.
    - name: Restart so the pods pick up their configuration
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} rollout restart deploy/quantify-{{ item }}
      loop: "{{ targets | intersect(known_services) }}"
      changed_when: true

    - name: Wait for the rollout
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} rollout status deploy/quantify-{{ item }}
          --timeout=10m
      loop: "{{ targets | intersect(known_services) }}"
      changed_when: false

    # --- and then ask it what it is ----------------------------------------
    #
    # `rollout status` says Kubernetes is satisfied. It does not say the
    # service answers, and a pod that is running but misconfigured satisfies
    # Kubernetes completely.
    # Named so neither is a substring of the other. They were
    # `DOMAIN_PLACEHOLDER` and `IDENTITY_DOMAIN_PLACEHOLDER`, and substituting
    # the first rewrote the tail of the second — the identity host became
    # `IDENTITY_quantify.club`. Kubernetes rejected it only because `_` is
    # illegal in a hostname; a placeholder pair that collided into something
    # *valid* would have published the identity provider on the wrong name and
    # broken every token it signs.
    - name: Render the ingress
      ansible.builtin.set_fact:
        rendered_ingress: "{{ lookup('file', playbook_dir + '/../../deploy/kubernetes/ingress.yaml')
                              | replace('__WEB_HOST__', domain)
                              | replace('__IDENTITY_HOST__', identity_domain) }}"
      when: "'ingress' in targets"

    - name: Refuse an ingress with a placeholder still in it
      ansible.builtin.assert:
        that: "'PLACEHOLDER' not in rendered_ingress and '__' not in rendered_ingress"
        fail_msg: >-
          the rendered ingress still contains a placeholder, so at least one
          host is not the name it was meant to be
      when: "'ingress' in targets"

    - name: The ingress, once the services it names exist
      kubernetes.core.k8s:
        definition: "{{ item }}"
        state: present
      loop: "{{ rendered_ingress | from_yaml_all | select | list }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"
      when: "'ingress' in targets"

    # An Ingress object exists the moment it is accepted. The load balancer it
    # describes does not, and the gap is minutes. Waiting here rather than
    # reporting success on the object means the playbook does not hand back a
    # hostname that is still empty.
    - name: Wait for the load balancer to be provisioned
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} get ingress quantify-web
          -o jsonpath={.status.loadBalancer.ingress[0].hostname}
      register: alb_hostname
      changed_when: false
      retries: 40
      delay: 15
      until: alb_hostname.stdout | length > 0
      when: "'ingress' in targets"

    - name: Report where the tunnel should be pointed
      ansible.builtin.debug:
        msg: >-
          ALB {{ alb_hostname.stdout }} — this is what cloudflare.tf must
          address for the cutover. It is internal, so it is reachable from the
          VPC and not from the internet.
      when: "'ingress' in targets"

    # Zitadel answers `/debug/ready`, not `/version`. Asked separately rather
    # than widening the identity check, because "every service answers the same
    # endpoint" is a convenience and this one is a different program.
    - name: Ask identity whether it is ready
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} run readycheck-{{ 999 | random }}
          --rm -i --restart=Never --quiet
          --image=public.ecr.aws/docker/library/busybox:1.36
          --command -- wget -qO- --timeout=20 http://quantify-identity/debug/ready
      register: identity_ready
      changed_when: false
      failed_when: identity_ready.rc != 0
      when: "'identity' in targets"

    - name: Ask each service to identify itself
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k8s_namespace }} run probe-{{ item }}-{{ 999 | random }}
          --rm -i --restart=Never --quiet
          --image=public.ecr.aws/docker/library/busybox:1.36
          --command -- wget -qO- --timeout=10 http://quantify-{{ item }}/version
      loop: "{{ targets | intersect(known_services)
                          | difference(['identity', 'web', 'tunnel']) }}"
      register: identity
      changed_when: false
      failed_when: identity.rc != 0 or 'contract_version' not in identity.stdout

    - name: What answered
      ansible.builtin.debug:
        msg: "quantify-{{ item.item }} -> {{ item.stdout | trim }}"
      loop: "{{ identity.results }}"
      loop_control:
        label: "{{ item.item }}"
