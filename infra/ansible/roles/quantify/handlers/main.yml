---
- name: Restart the application
  # `up -d` rather than `restart`: the compose file or the image may have
  # changed, and `restart` would faithfully restart the old definition and
  # report success. Recreating only what differs also leaves an unchanged
  # deploy without a needless outage.
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: /opt/quantify
  become: true
  changed_when: true
