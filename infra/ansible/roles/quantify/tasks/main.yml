---
# Deploy the pinned image, migrate, start, and prove the deployment serves.
#
# Every step is re-runnable. The environment file is rendered on the host and
# compared before writing, so a deploy that changes nothing restarts nothing —
# a playbook that bounces a healthy service on every run is one people stop
# running, and then stop trusting.

- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init
  changed_when: false
  failed_when: cloud_init.rc not in [0, 2] # 2 is "done, with warnings"

- name: Install host packages
  ansible.builtin.apt:
    name:
      - gettext-base # envsubst, for rendering secrets on the host
      - unzip
      - python3
      - curl
    state: present
    update_cache: true
  become: true

- name: Check for the AWS CLI
  ansible.builtin.command: aws --version
  register: aws_cli
  changed_when: false
  failed_when: false

- name: Install the AWS CLI
  when: aws_cli.rc != 0
  become: true
  block:
    - name: Download the AWS CLI
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Unpack the AWS CLI
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Install the AWS CLI
      ansible.builtin.command: /tmp/aws/install --update
      changed_when: true

- name: Ensure Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

# --- layout ----------------------------------------------------------------

- name: Create the application directory
  ansible.builtin.file:
    path: /opt/quantify
    state: directory
    owner: root
    group: root
    # Not world-readable. The rendered environment file lives here.
    mode: "0750"
  become: true

- name: Create the telemetry directory
  ansible.builtin.file:
    path: /var/lib/quantify
    state: directory
    mode: "0755"
  become: true

# --- registry --------------------------------------------------------------

- name: Authenticate to the image registry
  when: quantify_registry_host | length > 0 and 'ecr' in quantify_registry_host
  ansible.builtin.shell: |
    set -euo pipefail
    aws ecr get-login-password --region {{ quantify_region }} \
      | docker login --username AWS --password-stdin {{ quantify_registry_host }}
  args:
    executable: /bin/bash
  become: true
  changed_when: true
  # Deliberately *not* no_log. The token goes to `docker login` on stdin, so
  # it never appears in argv or in the output — and `no_log` here hid the
  # actual failure, an IAM role with no ecr:GetAuthorizationToken, behind
  # "output has been hidden". A control that conceals a diagnostic without
  # concealing a secret costs something and protects nothing.

- name: Note a non-ECR registry
  when: quantify_registry_host | length > 0 and 'ecr' not in quantify_registry_host
  ansible.builtin.debug:
    msg: >-
      {{ quantify_registry_host }} is not ECR. If the image is private, run
      `docker login` on the host once; the credential persists in
      /root/.docker/config.json and this playbook does not manage it.

# --- configuration ---------------------------------------------------------

# The OIDC client id, if some earlier deploy already created the application.
#
# It has to be known before the environment is rendered and cannot be known
# until the provider is running, so the first deploy renders without it,
# bootstraps, writes it here and re-renders. Every deploy after that reads it
# on the way past and converges in one pass.
#
# Kept on the host rather than in a variables file because the provider is what
# decides it. A copy in Terraform would be a second opinion about a fact only
# one of them holds.
- name: Make the directory the provider writes its service-account token into
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.file:
    path: /opt/quantify/machinekey
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Read the OIDC client id, if one has already been created
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.slurp:
    src: /opt/quantify/identity-client-id
  become: true
  register: known_client_id
  failed_when: false
  changed_when: false

- name: Adopt it
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.set_fact:
    quantify_identity_client_id: >-
      {{ (known_client_id.content | b64decode | trim)
         if (known_client_id.content is defined) else "" }}

- name: Install the environment template
  ansible.builtin.template:
    src: production.env.j2
    dest: /opt/quantify/env.template
    owner: root
    group: root
    mode: "0640"
  become: true
  notify: Restart the application

- name: Install the Caddy template
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/quantify/Caddyfile.template
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the application

- name: Install the render script
  ansible.builtin.template:
    src: render-env.sh.j2
    dest: /opt/quantify/render-env.sh
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Render the environment and Caddy configuration on the host
  # The secrets are fetched here, under the instance profile, and never reach
  # the controller. `no_log` covers the failure path: the script prints only
  # CHANGED or UNCHANGED, but a traceback from the AWS CLI could carry more.
  ansible.builtin.command: /opt/quantify/render-env.sh
  become: true
  register: rendered
  changed_when: "'CHANGED' in rendered.stdout"
  no_log: true
  notify: Restart the application

- name: Report what the render did
  ansible.builtin.debug:
    msg: "configuration {{ 'changed' if rendered.changed else 'unchanged' }}"

# The identity provider's own database, inside the RDS instance that already
# exists. Created here rather than in Terraform because Terraform holds no
# database credentials — RDS gives it an endpoint, not a session — and adding a
# Postgres provider to reach inside would put the master password into the
# state file.
#
# `CREATE DATABASE` is not transactional and has no IF NOT EXISTS, so this asks
# first. Re-runnable by construction, which every task in this playbook has to
# be.
- name: Create the identity provider's database
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.shell: |
    set -euo pipefail
    # The password from Secrets Manager, not from /opt/quantify/.env.
    #
    # That file is the env format compose reads, which is not shell: values
    # are unquoted, and sourcing it ran the database URL as a command the
    # moment a password contained a character bash treats specially. Compose
    # parses it correctly because compose is what it is written for.
    #
    # No apostrophes below this line. Ansible splits a shell block into
    # arguments before bash ever sees it, and one inside a comment reads as an
    # unbalanced quote — which is how the previous version of this comment
    # failed the playbook rather than the command.
    PGPASSWORD="$(aws secretsmanager get-secret-value \
      --region '{{ quantify_region }}' \
      --secret-id '{{ quantify_secret_database }}' \
      --query SecretString --output text)"
    export PGPASSWORD

    # `CREATE DATABASE` is not transactional and has no IF NOT EXISTS, so this
    # asks first. Re-runnable by construction, like every task here.
    exists=$(docker run --rm -e PGPASSWORD postgres:16-alpine \
      psql -h '{{ quantify_database_host }}' -U quantify -d quantify -tAc \
      "SELECT 1 FROM pg_database WHERE datname='zitadel'")
    if [ "$exists" != "1" ]; then
      docker run --rm -e PGPASSWORD postgres:16-alpine \
        psql -h '{{ quantify_database_host }}' -U quantify -d quantify \
        -c "CREATE DATABASE zitadel"
      echo CREATED
    else
      echo PRESENT
    fi
  args:
    executable: /bin/bash
  become: true
  register: identity_database
  changed_when: "'CREATED' in identity_database.stdout"
  no_log: true

- name: Report the identity database
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.debug:
    msg: "identity database {{ 'created' if identity_database.changed else 'already present' }}"

- name: Install the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/quantify/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  register: compose_installed
  notify: Restart the application

# --- image -----------------------------------------------------------------

# Before the pull, not after.
#
# Nine deploys of a 4GB image filled a 29GB volume and the tenth failed
# mid-extract with "no space left on device" — a deployment that works
# repeatedly and then does not, for a reason that has nothing to do with the
# change being deployed. Pruning afterwards would not have helped: the pull
# that runs out of space is the one that needed the room.
#
# `-a` removes every image no container is using, which by construction spares
# the running one. The tunnel and proxy images are in use and survive.
- name: Reclaim space from superseded images
  ansible.builtin.command: docker image prune -af
  become: true
  register: pruned
  changed_when: "'Total reclaimed space: 0B' not in pruned.stdout"

- name: Report what was reclaimed
  ansible.builtin.debug:
    msg: "{{ pruned.stdout_lines | select('search', 'Total reclaimed') | list }}"

  # How much room this particular pull needs, rather than a constant.
  #
  # The constant was 8GB, chosen when the image was around 4GB. It then blocked
  # a deploy on a host with 5.8GB free — for an image of 1.2GB, which would have
  # fit four times over. A fixed threshold encodes the size of whatever image
  # was current the day it was written, and goes wrong in both directions: too
  # small once an image grows, and a false refusal once one shrinks.
  #
  # The manifest gives the compressed layer sizes before anything is
  # transferred. Extracted layers run larger than compressed, and the old image
  # is still resident until the new container replaces it, so the requirement is
  # three times compressed with a 2GB floor for the container writable layer and
  # logs.
- name: Measure what this image needs
  ansible.builtin.shell: |
    set -euo pipefail
    aws ecr get-login-password --region {{ quantify_region }} \
      | docker login --username AWS --password-stdin \
        "$(echo '{{ quantify_image }}' | cut -d/ -f1)" >/dev/null 2>&1
    docker manifest inspect '{{ quantify_image }}' \
      | python3 -c 'import json,sys; m=json.load(sys.stdin); print(sum(l["size"] for l in m.get("layers",[])))'
  args:
    executable: /bin/bash
  become: true
  register: image_bytes
  changed_when: false

- name: Refuse to deploy onto a full disk
  # A pull needs room for the compressed layers and the extracted tree at
  # once. Failing here names the problem; failing in the middle of an extract
  # reports a missing shared object.
  ansible.builtin.shell: |
    set -euo pipefail
    df --output=avail -BG / | tail -1 | tr -d ' G'
  args:
    executable: /bin/bash
  register: free_space
  changed_when: false

- name: Refuse to deploy onto a full disk
  # Say both numbers. "Refused: 6GB free" without the requirement beside it
  # sends whoever reads it looking for a threshold that is no longer written
  # down anywhere.
  ansible.builtin.assert:
    that: (free_space.stdout | int) >= (required_gb | int)
    fail_msg: >-
      {{ free_space.stdout }}GB free, {{ required_gb }}GB required for
      {{ ((image_bytes.stdout | int) / 1073741824) | round(2) }}GB of layers
    success_msg: >-
      {{ free_space.stdout }}GB free, {{ required_gb }}GB required
  vars:
    required_gb: >-
      {{ [((image_bytes.stdout | int) * 3 / 1073741824) | round(0, 'ceil') | int,
          2] | max }}

- name: Pull the pinned image
  ansible.builtin.command: docker pull {{ quantify_image }}
  become: true
  register: pulled
  changed_when: "'Downloaded newer image' in pulled.stdout"

# --- migrations ------------------------------------------------------------

# Before the service starts. The application refuses to serve a database at
# the wrong head, so an unmigrated deployment fails readiness rather than
# serving a schema it does not understand — but it fails as an outage, and
# this makes it a deploy step instead.
- name: Run migrations against RDS
  ansible.builtin.shell: |
    set -euo pipefail
    docker run --rm --env-file /opt/quantify/.env {{ quantify_image }} \
      python -c "
    from src.db import migrate
    from src.db.engine import Database
    import os
    database = Database(os.environ['QUANTIFY_DATABASE_URL'])
    migrate.upgrade(database)
    print('MIGRATED_TO=' + str(migrate.applied_revision(database)))
    print('CODE_HEAD=' + migrate.code_head())
    "
  args:
    executable: /bin/bash
  become: true
  register: migration
  changed_when: true

- name: Show the migration result
  ansible.builtin.debug:
    msg: "{{ migration.stdout_lines | select('search', '^(MIGRATED_TO|CODE_HEAD)=') | list }}"

- name: Fail if the database is not at the code head
  ansible.builtin.assert:
    that:
      - (migration.stdout | regex_findall('MIGRATED_TO=(\\S+)') | first)
        == (migration.stdout | regex_findall('CODE_HEAD=(\\S+)') | first)
    fail_msg: >-
      The database is not at the migration head this image expects. The
      application would refuse to serve with MIGRATION_MISMATCH.

# --- run -------------------------------------------------------------------

- name: Start the stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: /opt/quantify
  become: true
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

- name: Apply any pending restart before verifying
  ansible.builtin.meta: flush_handlers

# --- proof -----------------------------------------------------------------

# Readiness, not liveness. `/health/live` answers that a process exists; this
# waits for the preflight to have passed — migrated database, matching schema,
# observable build, declared parser.
- name: Wait for the application to report ready
  ansible.builtin.uri:
    # Port 80, through Caddy — not 8000. The AWS compose file `expose`s the
    # api port to the compose network rather than publishing it to the host,
    # so nothing is listening on 127.0.0.1:8000 and the check failed thirty
    # times against a deployment that was serving correctly.
    #
    # Going through the proxy is the better check anyway: it proves the path
    # the load balancer actually uses, including that Caddy leaves /health
    # unauthenticated. An authenticated health endpoint would make every
    # target look unhealthy.
    url: http://127.0.0.1:80/health/ready
    status_code: 200
  register: readiness
  retries: 30
  delay: 5
  until: readiness.status is defined and readiness.status == 200
  # Runs on the host, against the api container's own port. That asks whether
  # the application is serving — not whether the proxy is configured or the
  # load balancer is routing. Those are the public path, and the public path
  # is what deploy/acceptance.py checks, from outside.

- name: Read the startup proof from the container log
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml logs api 2>&1 \
      | grep -F "deployment proof" | tail -5 || true
  args:
    executable: /bin/bash
  become: true
  register: startup_proof
  changed_when: false

- name: Fail if the deployment left no startup proof
  ansible.builtin.assert:
    that:
      - startup_proof.stdout | length > 0
    fail_msg: >-
      The application is ready but logged no deployment proof. The operator
      channel is the only record of what configuration is live, and the
      migration that disabled it once already shipped silently — see
      tests/test_error_surface.py::TestTheOperatorChannelSurvivesAMigration.

- name: Show the startup proof
  ansible.builtin.debug:
    var: startup_proof.stdout_lines

- name: Confirm the deployed build is the planned one
  # The proof states what the process resolved. Comparing it against what this
  # playbook intended is the difference between "a configuration was logged"
  # and "the configuration we deployed is the one running".
  ansible.builtin.assert:
    that:
      - quantify_build_commit in startup_proof.stdout
      - '"\"result\": \"READY\"" in startup_proof.stdout'
    fail_msg: >-
      The running deployment does not report the commit this playbook
      deployed, or did not reach READY. Something else is serving on this host.

# What the container is, asked of Docker rather than of the deployment.
#
# The assertion above compares the startup proof against
# `quantify_build_commit`, and the proof takes its commit from that same
# variable by way of the environment file. It is the deployment agreeing with
# itself, and it passed on 2026-08-12 while the host ran an image from an
# earlier build: `application_image` had drifted from `build_commit`, so the
# container reported a revision whose code it was not running.
#
# Docker is the independent witness. It knows which bytes it started, and it
# has no opinion about which commit anybody intended.
- name: Read the image the container is actually running
  ansible.builtin.shell: |
    set -euo pipefail
    docker inspect --format '{{ '{{' }}.Image{{ '}}' }}' quantify-api-1 2>/dev/null \
      || docker compose -f /opt/quantify/docker-compose.yml images -q api
    echo "---"
    docker image inspect --format '{{ '{{' }}index .RepoDigests 0{{ '}}' }}' \
      "{{ quantify_image }}"
  args:
    executable: /bin/bash
  become: true
  register: running_image
  changed_when: false
  failed_when: false

- name: Confirm the running container is the planned image
  ansible.builtin.assert:
    that:
      - quantify_image.split('@')[1] in running_image.stdout
    fail_msg: >-
      The container is not running {{ quantify_image.split('@')[1] }}. The
      deployment declares a commit whose image is not what started, which is
      how a service comes to serve one revision and report another.
    success_msg: "running the planned image {{ quantify_image.split('@')[1][:19] }}"

# The parser is checked separately because the startup proof does not carry
# it. The proof reports build, database and result — asserting a parser mode
# against it failed against a deployment that was configured correctly, which
# is a check reporting on the wrong source rather than a bad deployment.
#
# Reading the resolved context inside the running container is the right
# source anyway: it is what the process would use to interpret a description,
# not what the environment file asked for.
- name: Read the parser identity the running container resolved
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api python -c "
    import json
    from src.deploy.context import resolve
    print('PARSER=' + json.dumps(resolve().model.identity()))
    "
  args:
    executable: /bin/bash
  become: true
  register: parser_identity
  changed_when: false

- name: Confirm the parser is the planned one
  ansible.builtin.assert:
    that:
      - quantify_parser_mode in parser_identity.stdout
      - quantify_parser_model in parser_identity.stdout
      # The provider too, and lowercased because the identity is what a plan
      # stores rather than what Terraform declares.
      #
      # Checking only the model passed the deploy of d074390 on an identity
      # that read `"provider": "anthropic", "model": "gpt-5.4-2026-03-05"` —
      # two halves of one object naming different vendors, while the reader
      # that answered was OpenAI's. The model matched, so the assertion was
      # satisfied by exactly the half that was right.
      - '"\"provider\": \"" ~ (quantify_parser_provider | lower) ~ "\"" in parser_identity.stdout'
    fail_msg: >-
      The running container resolved a different parser than this playbook
      deployed. A plan saved now would record an interpretation nobody chose.

- name: Show the parser identity
  ansible.builtin.debug:
    msg: "{{ parser_identity.stdout_lines | select('search', '^PARSER=') | list }}"

# The proxy is configuration in a bind-mounted file, which `docker compose up
# -d` will not notice. This asserts the running proxy actually serves the
# configuration just deployed, rather than trusting that writing the file was
# enough — it was not, and the deploy reported success anyway.
# One real reading, from the container, against the provider it declares.
#
# Everything above this point is configuration agreeing with configuration. The
# parser identity check compares what the process resolved against what the
# playbook intended, and both come from the same variables — it passes happily
# with a credential belonging to a different vendor, because nothing has asked
# the provider anything.
#
# That gap is not hypothetical: the secret holds one vendor's key, the provider
# is declared separately, and switching the declaration without rotating the
# key produces a deployment that starts cleanly, reports a valid configuration,
# and fails on the first sentence a user types. A deploy is the last moment
# this is cheap to find out.
#
# One short sentence, and the reading is discarded. What is under test is
# whether the credential and the provider belong together.
- name: Prove the declared provider actually answers
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api python -c "
    from src.discovery.readers_quantify import configured_hosted_reader
    from src.discovery.schema import QUANTIFY_SCHEMA
    reader = configured_hosted_reader()
    if not reader.available():
        raise SystemExit('NO_KEY: ' + reader.api_key_env + ' is unset for ' + reader.id)
    result = reader.read('invest \$500 a month into VTI', QUANTIFY_SCHEMA)
    if not result.ok:
        raise SystemExit('PROVIDER_REFUSED: ' + str(result.failed))
    print('PROVIDER_OK=' + reader.id)
    "
  args:
    executable: /bin/bash
  become: true
  register: provider_live
  changed_when: false
  failed_when: "'PROVIDER_OK=' not in provider_live.stdout"

- name: Show which reader answered
  ansible.builtin.debug:
    msg: "{{ provider_live.stdout_lines | select('search', 'PROVIDER_OK') | list }}"

# Render the library once, so the first visitor does not pay for it.
#
# The index runs a backtest per methodology version and memoises the result.
# That makes every request after the first cheap and leaves the first one
# expensive — 36s on this instance, which a browser presents as a link that
# does not open. Whoever loads it first would be a user; this makes it the
# deploy.
#
# It doubles as evidence. The page is otherwise unproven on the host: the
# identity proof reads /health and /info, and the journeys drive the workspace,
# so nothing has ever asked whether the research library renders at all.
- name: Render the research library once and time it
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api python -c "
    import time, urllib.request
    started = time.monotonic()
    with urllib.request.urlopen('http://localhost:8000/ui/', timeout=180) as page:
        body = page.read()
    print('LIBRARY_OK status=%d bytes=%d cold=%.1fs' % (page.status, len(body), time.monotonic() - started))
    started = time.monotonic()
    with urllib.request.urlopen('http://localhost:8000/ui/', timeout=60) as page:
        page.read()
    print('LIBRARY_WARM=%.2fs' % (time.monotonic() - started))
    "
  args:
    executable: /bin/bash
  become: true
  register: library_render
  changed_when: false
  failed_when: "'LIBRARY_OK status=200' not in library_render.stdout"

- name: Show how long the library took
  ansible.builtin.debug:
    msg: "{{ library_render.stdout_lines }}"

# The identity provider has to answer, or this deploy did not do what it said.
#
# Twice now the play has reported failed=0 while the provider restarted every
# minute — once on a blank database password, once on a blank masterkey. Both
# times the recap was green and the discovery endpoint was a 502, which is the
# exact pattern this playbook spends its other forty tasks refusing to allow.
#
# Its own database migrations run on first boot and take a couple of minutes,
# so this waits rather than checking once.
# The provider's schema and first instance, created as awaited steps.
#
# Separate from the running container, because a migration inside a restartable
# container is a migration that will one day be interrupted — and this one does
# not resume. Interrupted, it either holds its marker forever or half-writes the
# default instance and fails afterwards on a duplicate unique constraint. Both
# have happened here, and both cost a database recreate.
#
# `run --rm` blocks until each finishes, so the play cannot proceed past a
# migration in flight, and nothing else is running to interrupt it.
- name: Initialise the identity provider's schema
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.command:
    # No masterkey flag: `init` does not take one. Its whole job is the
    # database objects and the role that owns them, which is why it reads the
    # admin credentials and nothing encrypted.
    cmd: docker compose run --rm -T identity init
    chdir: /opt/quantify
  become: true
  register: identity_init
  changed_when: identity_init.rc == 0
  failed_when: false

- name: Create the first instance
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.command:
    cmd: docker compose run --rm -T identity setup --masterkeyFromEnv --init-projections=true
    chdir: /opt/quantify
  become: true
  register: identity_setup
  changed_when: identity_setup.rc == 0
  failed_when: false

# Recovery, guarded by a fact about this deployment rather than about Zitadel.
#
# The client-id file is written only after the OIDC application has been
# created, which is only possible once the provider has served. Its absence
# means this provider has never worked here — so its database holds nothing
# this deployment made, and recreating it costs nothing.
#
# With the file present, this never runs: a provider that has served may hold
# real accounts, and the right answer then is to fail and be read by a person.
- name: Recreate the provider's database if setup failed and it has never served
  when:
    - quantify_identity_domain | default("") | length > 0
    - identity_setup.rc != 0
    - known_client_id.content is not defined
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml rm -sf identity
    PW="$(aws secretsmanager get-secret-value --region {{ quantify_region }} \
      --secret-id {{ quantify_secret_database }} --query SecretString --output text)"
    docker run --rm -e PGPASSWORD="$PW" postgres:16-alpine psql \
      -h {{ quantify_database_host }} -U quantify -d quantify \
      -c 'DROP DATABASE IF EXISTS zitadel' -c 'CREATE DATABASE zitadel'
    docker compose -f /opt/quantify/docker-compose.yml run --rm -T identity init
    docker compose -f /opt/quantify/docker-compose.yml run --rm -T identity \
      setup --masterkeyFromEnv --init-projections=true
  args:
    executable: /bin/bash
  become: true
  register: identity_recovered
  changed_when: identity_recovered.rc == 0
  failed_when: false

- name: Fail if the provider has no first instance
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.assert:
    that: identity_setup.rc == 0 or identity_recovered.rc | default(1) == 0
    fail_msg: >-
      The identity provider's setup did not complete, so it has no instance to
      serve. What it said:
      {{ (identity_recovered.stderr | default(identity_setup.stderr, true))
         | default("(nothing)", true) | truncate(900) }}
    success_msg: "The provider has a first instance."

# Safe to restart now: `start` runs no migrations.
- name: Start the identity provider
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate identity
    chdir: /opt/quantify
  become: true
  changed_when: true

# Asked through the proxy, from the host, on the route a browser takes.
#
# The first version of this ran `docker compose exec identity curl`. The image
# is distroless and has no curl, so the check could never pass — it failed
# identically whether the provider was healthy or dead, and the one time it
# fired the provider happened to be genuinely stuck, which is how a check that
# always fails passes for a competent one.
#
# Through the proxy is also the better question. It covers the provider, the
# proxy's routing by Host, and the header rewriting below — the whole path a
# login actually travels — instead of a port inside a container that no user
# can reach. It prints the issuer, so the assert below has something to check.
- name: Wait for the identity provider to answer
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sf --max-time 20 -H "Host: {{ quantify_identity_domain }}" \
      http://127.0.0.1/.well-known/openid-configuration \
      | python3 -c "import json,sys; print(json.load(sys.stdin)['issuer'])"
  args:
    executable: /bin/bash
  become: true
  register: identity_ready
  retries: 30
  delay: 10
  until: identity_ready.rc == 0
  changed_when: false
  failed_when: false

# What the provider says about itself, when it never answered.
#
# The first time this fired, the reason was a stuck migration: an earlier run
# died mid-step on an empty masterkey, left `03_default_instance` marked as
# started and never finished, and every later boot waited five seconds at a
# time for an instance that no longer existed. The container was Up, the port
# was open, and nothing was listening on it.
#
# Reading the log here turns "not serving after five minutes" into the actual
# sentence, so whoever is looking does not have to know to go and find it.
- name: Read why the identity provider is not answering
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.shell: |
    set -euo pipefail
    docker logs quantify-identity-1 2>&1 | tail -5
  args:
    executable: /bin/bash
  become: true
  register: identity_why
  changed_when: false
  failed_when: false

- name: Fail if the identity provider never came up
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.assert:
    # The return code alone: `curl -sf` already fails on any status that is
    # not a success, and the body is now the issuer rather than the code.
    that: identity_ready.rc == 0
    fail_msg: >-
      The identity provider is not serving its discovery document after five
      minutes. The deployment is otherwise fine and auth.quantify.club will
      return 502.

      Its last words: {{ identity_why.stdout_lines | default([]) | join(" | ") }}

      If those say "migration already started", a previous run died mid-step and
      left the marker behind; the provider will wait forever for an instance
      that is gone. Recreating its database clears it, and is safe while no
      accounts exist — the step that creates the first organisation is the one
      that is stuck, so nothing has been created yet.
    success_msg: "identity provider serving OIDC discovery"

# The issuer the provider publishes must be the one the application verifies.
#
# It published `http://auth.quantify.club` while the application was configured
# for `https://`, because TLS terminates at the edge and the request reaching
# the provider is genuinely plaintext. Every token would then carry an `iss`
# the verifier rejects, and the symptom arrives as "login is broken" long after
# the deploy reported success.
- name: Install the bootstrap script
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.template:
    src: bootstrap-identity.py.j2
    dest: /opt/quantify/bootstrap-identity.py
    owner: root
    group: root
    mode: "0750"
  become: true

# Create the application, or adopt the one already there.
#
# Runs on every deploy rather than only when the client id is unknown: it finds
# the existing application by name and returns the same id, so a re-run is a
# check that what this deployment logs in through still exists. An application
# deleted in the console would otherwise surface as a login failure with no
# deploy having reported anything.
- name: Create the OIDC application, or find the one already created
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.command: /opt/quantify/bootstrap-identity.py
  become: true
  register: bootstrapped
  changed_when: false
  failed_when: bootstrapped.rc != 0

- name: Record the client id for the next deploy
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.copy:
    content: "{{ bootstrapped.stdout | trim }}\n"
    dest: /opt/quantify/identity-client-id
    owner: root
    group: root
    mode: "0640"
  become: true
  register: recorded_client_id

# The first deploy rendered the environment before the application existed, so
# the running container has an empty client id and cannot start a login. This
# re-renders with the value now known and restarts, which makes the first
# deploy converge rather than requiring a second one to finish the job.
- name: Re-render the environment now the client id is known
  when:
    - quantify_identity_domain | default("") | length > 0
    - recorded_client_id.changed
  ansible.builtin.set_fact:
    quantify_identity_client_id: "{{ bootstrapped.stdout | trim }}"

- name: Install the environment template with the client id
  when:
    - quantify_identity_domain | default("") | length > 0
    - recorded_client_id.changed
  ansible.builtin.template:
    src: production.env.j2
    dest: /opt/quantify/env.template
    owner: root
    group: root
    mode: "0640"
  become: true

- name: Render it and restart the application
  when:
    - quantify_identity_domain | default("") | length > 0
    - recorded_client_id.changed
  ansible.builtin.command: /opt/quantify/render-env.sh
  become: true
  register: rerendered
  changed_when: "'CHANGED' in rerendered.stdout"
  no_log: true
  notify: Restart the application

- name: Confirm the published issuer is the one the application trusts
  when: quantify_identity_domain | default("") | length > 0
  ansible.builtin.assert:
    that:
      - identity_ready.stdout | trim == "https://" ~ quantify_identity_domain
    fail_msg: >-
      The provider publishes {{ identity_ready.stdout | trim }} but the
      application verifies tokens against
      https://{{ quantify_identity_domain }}. Tokens signed under one issuer do
      not verify against the other, so login would fail for everybody with a
      signature error. TLS terminates at the edge; the proxy has to pass the
      browser scheme on as X-Forwarded-Proto.
    success_msg: "Issuer: {{ identity_ready.stdout | trim }}"

- name: Confirm the proxy is serving the deployed configuration
  ansible.builtin.uri:
    url: http://127.0.0.1:80/
    follow_redirects: none
    status_code: [302, 301]
  register: root_redirect
  retries: 5
  delay: 5
  until: root_redirect.status is defined and root_redirect.status in [301, 302]

- name: Confirm the root points at the workspace
  ansible.builtin.assert:
    that:
      - "'/workspace/' in (root_redirect.location | default(''))"
    fail_msg: >-
      The root does not redirect to the workspace. A pilot user typing the
      hostname would land on the API's service metadata.

# --- retention -------------------------------------------------------------

# There is deliberately no scheduling subsystem in the application. A cron
# entry is the whole requirement, and installing it at deploy time is the
# difference between a documented procedure and a running one.
# --- the research dashboard ------------------------------------------------

- name: Create the research directory
  ansible.builtin.file:
    path: /var/lib/quantify/research
    state: directory
    mode: "0755"
  become: true

# Rebuild the dashboard daily, on the host, from the day's history.
#
# This is what `daily-deploy.yml` did three times a day before it was replaced,
# and replacing it deployed the application and nothing else — so the backtest
# stopped running, the Bokeh document stopped being built, and /research went
# from a dashboard to a 404. The code was never removed; it was unwired.
#
# `/var/lib/quantify` is already mounted into the container, so the output lands
# where the application serves it from and survives a restart. The history
# parquets are regenerated first because they are not in the image: they are
# data the pipeline produces, not source, and shipping a copy would freeze the
# charts at whatever the last release happened to hold.
#
# 04:20 rather than on the hour. A backtest and a 6MB document on a t3.small is
# minutes of CPU, and the trace purge already owns 03:17.
- name: Install the research dashboard cron job
  ansible.builtin.cron:
    name: quantify-research-dashboard
    minute: "20"
    hour: "4"
    job: >-
      cd /opt/quantify && /usr/bin/docker compose exec -T api sh -c
      'python -m src.history --start 2016-01-01 --end $(date +%%Y-%%m-%%d) &&
      python -m src.visualization.bokeh_app
      --output /var/lib/quantify/research/regime_dashboard.html'
      >> /var/log/quantify-research.log 2>&1
    user: root
  become: true

# Build it once now, so the page is not empty until tomorrow morning.
#
# Deliberately not fatal. The backtest is the one step in this playbook that
# depends on data the image does not carry, and a deployment that refuses
# because a chart could not be drawn would be weighing the dashboard above the
# service. What it must not do is fail silently: the result is reported either
# way, and /research says "not built yet" rather than 404 until it succeeds.
- name: Build the research dashboard once
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api sh -c '
      python -m src.history --start 2016-01-01 --end $(date +%Y-%m-%d) &&
      python -m src.visualization.bokeh_app \
        --output /var/lib/quantify/research/regime_dashboard.html'
  args:
    executable: /bin/bash
  become: true
  register: dashboard_build
  changed_when: false
  failed_when: false
  timeout: 1800

- name: Report whether the dashboard built
  ansible.builtin.debug:
    msg: >-
      {{ 'RESEARCH_OK — /research is serving a freshly built dashboard'
         if dashboard_build.rc == 0 else
         'RESEARCH_NOT_BUILT (rc=' ~ dashboard_build.rc ~ ') — /research will
          say so rather than 404. Last lines: '
         ~ (dashboard_build.stderr_lines | default([]))[-3:] | join(' | ') }}

- name: Install the trace purge cron job
  ansible.builtin.cron:
    name: quantify-trace-purge
    minute: "17"
    hour: "3"
    job: >-
      cd /opt/quantify && /usr/bin/docker compose exec -T api
      python -m src.telemetry.purge >> /var/log/quantify-purge.log 2>&1
    user: root
  become: true

# --- journeys --------------------------------------------------------------

- name: Count the plans already in the pilot workspace
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api python -c "
    import os
    from src.workspace.store import WorkspaceStore
    store = WorkspaceStore(os.environ['QUANTIFY_DATABASE_URL'])
    print('PLANS=' + str(len(store.list_plans('pilot'))))
    "
  args:
    executable: /bin/bash
  become: true
  register: plan_count
  changed_when: false

- name: Decide whether the deploy-time journeys may run
  ansible.builtin.set_fact:
    # `regex_findall`, not `regex_search` with a '\1' group reference. In a
    # YAML block scalar the backslash is literal, so '\\1' reaches Jinja as two
    # backslashes and the group never resolves — the filter returns None and
    # the play dies on a deployment that answered correctly. findall returns
    # the groups directly and has nothing to escape.
    quantify_workspace_empty: >-
      {{ (plan_count.stdout | regex_findall('PLANS=([0-9]+)') | first | int) == 0 }}

# The pilot has one owner and no per-plan deletion, so a smoke journey writes
# into the same workspace a real user reads. On a first deploy that is empty
# and safe; on a redeploy it would put test plans in someone's list, and the
# cleanup available — whole-workspace erasure — would take their data with it.
#
# So this runs only against an empty workspace and refuses otherwise. A check
# that cannot run safely should decline, not run anyway.
- name: Explain why the journeys are being skipped
  when: not (quantify_workspace_empty | bool)
  ansible.builtin.debug:
    msg: >-
      The pilot workspace already holds plans, so the deploy-time journeys are
      skipped: they would write into live user data, and the only cleanup this
      build offers is whole-workspace erasure. Verify by hand in a browser —
      docs/Runbook.md, deployment sequence step 8.

# The second sentence lost "starting in January 2015", and the deletion is the
# finding rather than a convenience.
#
# It stated an evaluation window, which this build refuses by name — it runs
# over the whole price history it holds and cannot restrict a run to a period.
# So the journey asserted that a sentence the engine correctly declines would
# save, and it had been passing only because the legacy compiler ignored the
# window silently. The first deploy of the pilot interpreter refused it, which
# is the right answer to the question the sentence asks.
#
# "never sold any of it" stays, deliberately. It was the *other* refusal on
# that run and it was false: a plan that never sells is exactly what this build
# does, and refusing it was `UNNECESSARY_REFUSAL` against the most common
# phrasing anybody uses for buy-and-hold. Keeping the clause here means the
# journey proves the fix on a host every time it deploys.
- name: Run both launch journeys against the deployment
  when: quantify_workspace_empty | bool
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api python -c "
    import sys
    sys.path.insert(0, '/app/tests')
    from fastapi.testclient import TestClient
    import src.api as api
    from conftest import submit_rendered_confirmation
    from src.workspace.store import WorkspaceStore
    import os

    JOURNEYS = [
        ('Roth contribution',
         'I contribute \$7,000 a year to a Roth IRA in VOO on the first '
         'trading day of January, reinvesting dividends, and I never sell.'),
        ('Historical replay',
         'I put \$500 a month into VTI and never sold any of it.'),
    ]

    store = WorkspaceStore(os.environ['QUANTIFY_DATABASE_URL'])
    with TestClient(api.app) as client:
        for name, description in JOURNEYS:
            response, plan_id = submit_rendered_confirmation(
                client, description, title=name)
            assert response.status_code == 303, (name, response.status_code)
            assert plan_id, name
            runs = store.runs_for(plan_id, 'pilot')
            assert runs, name + ': the plan saved with no run at all'
            worksheet = store.worksheet_for_scenario(plan_id, 'pilot')
            assert worksheet is not None, name + ': no worksheet'
            # A run row is not a figure.
            #
            # This asserted only that a run existed, and a run exists when the
            # engine declines too: an image built without market data read the
            # sentence, compiled the plan, sealed the intent, recorded a run
            # saying no figure could be produced — and this passed. The
            # deployment was serving a product that cannot answer the question
            # it is for, and every check including this one was green.
            figures = [r for r in runs if getattr(r, 'final_value', None)
                       not in (None, 0)]
            assert figures, (
                name + ': the plan ran and produced no figure. The engine '
                'declined — market data, a refusal, or an empty result — so '
                'this deployment cannot answer what it is for')
            print('JOURNEY_OK=' + name + ' plan=' + plan_id
                  + ' value=' + str(figures[0].final_value))
    "
  args:
    executable: /bin/bash
  become: true
  register: journeys
  changed_when: true

- name: Show the journey results
  when: quantify_workspace_empty | bool
  ansible.builtin.debug:
    msg: "{{ journeys.stdout_lines | select('search', '^JOURNEY_OK=') | list }}"

- name: Prove both journeys ran
  when: quantify_workspace_empty | bool
  ansible.builtin.assert:
    that:
      - (journeys.stdout_lines | select('search', '^JOURNEY_OK=') | list | length) == 2
    fail_msg: >-
      Fewer than two journeys completed. A partial pass here is a deployment
      that serves one of the two supported scenarios.

# The smoke plans are removed so the first real user opens an empty workspace.
# Safe only because the workspace was empty before this playbook wrote to it —
# which the fact above established, and which is why that check exists.
- name: Remove the journey plans
  when: quantify_workspace_empty | bool
  ansible.builtin.shell: |
    set -euo pipefail
    docker compose -f /opt/quantify/docker-compose.yml exec -T api python -c "
    import os
    from src.workspace.store import WorkspaceStore
    from src.workspace.erasure import delete_workspace, verify_deleted
    store = WorkspaceStore(os.environ['QUANTIFY_DATABASE_URL'])
    delete_workspace(store, 'pilot', requested_at='deploy-smoke')
    remaining = verify_deleted(store, 'pilot')
    assert not any(remaining.values()), remaining
    print('WORKSPACE_CLEAN=true')
    "
  args:
    executable: /bin/bash
  become: true
  register: cleanup
  changed_when: true
  failed_when: "'WORKSPACE_CLEAN=true' not in cleanup.stdout"
