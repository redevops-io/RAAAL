[defaults]
# No inventory and no roles path. Both belonged to the EC2 deployment, which
# configured a machine found by EC2 tags; `services.yml` runs against localhost
# and talks to the Kubernetes API, so there is no host to discover and nothing
# to log into. Pointing at the old inventory file after archiving it made every
# run fail before its first task.
host_key_checking      = False
# `stdout_callback = yaml` was the obvious spelling and is wrong: that plugin
# was removed in ansible-core 2.20, and every run fails at startup with a
# message about community.general. The option below supersedes it.
result_format          = yaml
display_skipped_hosts  = False
interpreter_python     = /usr/bin/python3
retry_files_enabled    = False

# The playbook prints a deployment summary and the acceptance result. Diffs
# are suppressed on the environment file task specifically, so a run cannot
# print the model key to a terminal or a CI log.
[diff]
always = False

# No `[ssh_connection]` section either: nothing here connects to a host.
