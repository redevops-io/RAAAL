[defaults]
inventory              = inventory.aws_ec2.yml
roles_path             = roles
host_key_checking      = False
# `stdout_callback = yaml` was the obvious spelling and is wrong: that plugin
# was removed in ansible-core 2.20, and every run fails at startup with a
# message about community.general. The option below supersedes it.
result_format          = yaml
display_skipped_hosts  = False
interpreter_python     = /usr/bin/python3
retry_files_enabled    = False

# The playbook prints a deployment summary and the acceptance result. Diffs
# are suppressed on the environment file task specifically, so a run cannot
# print the model key to a terminal or a CI log.
[diff]
always = False

[ssh_connection]
pipelining = True
