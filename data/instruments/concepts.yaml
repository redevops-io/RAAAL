# Things a user can mean that are not themselves purchasable.
#
# An index is a measurement. An asset class is an exposure. Neither has a
# price you can buy at, and conflating them with the funds that track them is
# what made "SPX ETF" resolve to "no price history for SPX" — an answer about
# a ticker, to a question about intent.
#
# `aliases` here are ways of naming the *concept*. How somebody asks for a
# vehicle that delivers it is a separate file.
version: 1

concepts:
  - concept_id: INDEX:SP500
    kind: INDEX
    canonical_name: S&P 500 Index
    # Which fund to offer first when nothing in the phrase decides it.
    # Declared, because the alternative is ordering by whichever tie-break the
    # sort happens to apply — alphabetical put IVV ahead of SPY, which is an
    # accident presented as a recommendation.
    default_instrument: US:NYSEARCA:SPY
    aliases: ["s&p 500", "s&p500", "sp500", "spx", "^spx", "^gspc", "gspc",
              "the s&p", "s&p", "sandp500", "standard and poors 500"]

  - concept_id: INDEX:NASDAQ100
    kind: INDEX
    canonical_name: Nasdaq-100 Index
    aliases: ["nasdaq 100", "nasdaq100", "ndx", "^ndx", "nasdaq"]

