# Canonical instruments. One record per tradeable thing.
#
# The identity is not the ticker: tickers collide across venues, get reused
# after a delisting, and differ between data providers. `instrument_id` is the
# identity, `symbol` is a label, and `provider_symbols` is how each vendor
# happens to spell it.
#
# `tracks_index` and `delivers_exposure` are the typed relationships that make
# "SPX ETF" resolvable — an index concept plus a vehicle request, rather than
# an alias substitution.
