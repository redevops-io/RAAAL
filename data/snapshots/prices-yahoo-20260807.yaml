# CONFIRMED, not RESOLVED. This field was first written as `RESOLVED`, which is
# not a value the loader knows — `review_complete` tests for `CONFIRMED` — so
# the snapshot read as a snapshot whose licence review is still open, and every
# run under the approved policy was denied with that as the stated reason. The
# vocabulary is CONFIRMED / UNCONFIRMED; there is no third word.
license_review_status: CONFIRMED
license_record: data/licensing/market-data-licensing@1.yaml

# Attribution, as decided. Rendered wherever a figure is shown.
attribution:
  source: "Yahoo Finance"
  acknowledgement: "non-commercial usage only"

# One line per route out of the system, keyed by `Egress` and valued by
# `Decision`. The first draft of this block invented its own key names and used
# booleans; none of them matched, so every route silently fell through to the
# DENY default and the snapshot was unusable while appearing configured.
#
# Each line below is the licensing record's answer to a question, restated in
# the vocabulary the code reads.
egress_policy:
  # "may raw prices be redistributed: no"
  public_export: DENY
  # "no need identified; ask again before any export path is built" — DENY is
  # the encoding of that, not of a refusal. Revisit the record, not this line.
  case_bundle: DENY
  # "small snippets during testing ... never the full series", recorded as
  # operator-initiated with "no automated path". An automated upload route is
  # exactly what that excludes, so the route the code can take is DENY. The
  # permission is for a person, and this file governs code.
  model_provider_upload: DENY
  # "may derived results be shown to end users: yes, to the closed pilot
  # cohort" — derived figures only, never the price series.
  derived_aggregate: ALLOW
  internal_benchmark: ALLOW
  customer_result: ALLOW
