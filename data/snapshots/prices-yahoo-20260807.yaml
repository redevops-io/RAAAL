# Vendor prices, labelled as vendor prices.
#
# Deliberately not added to the synthetic fixture. The fixture's manifest says
# "invented ... safe to redistribute", and putting real prices behind that
# sentence would make every provenance record in the system a false statement
# about where its numbers came from. The whole build rests on provenance being
# true, so a second snapshot is the cheap answer and relabelling is not.
#
# Authorised by data/licensing/market-data-licensing@1.yaml — all six licensing
# questions answered, reviewed and dated. Non-commercial testing only.

