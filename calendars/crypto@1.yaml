spec_version: '0.1'
name: crypto
version: 1
title: Continuous 24/7 crypto sessions
source: >-
  Major crypto venues trade continuously. Included so that a protocol evaluating
  crypto instruments can declare the correct calendar rather than inheriting an
  equity one — and so that the mismatch which caused Erratum 02 is expressible
  and therefore checkable.

covers_from: '2000-01-01'
covers_to: '2035-12-31'
timezone: UTC
periods_per_year: 365
weekmask: [0, 1, 2, 3, 4, 5, 6]
holidays: []
