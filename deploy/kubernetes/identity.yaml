# Zitadel, moved and not upgraded.
#
# **v2.65.1, the version already running.** Relocating a container and
# upgrading an identity provider are two changes, and doing both at once means
# a login regression has two plausible causes. The upgrade is a separate
# decision for a separate day.
#
# **The same database, the same master key, the same issuer.** Zitadel's
# durable state is in RDS — database `zitadel`, reached with the same
# credential — so this move preserves the accounts that exist rather than
# migrating them. The master key decrypts what is in that database; a new one
# would leave every stored secret unreadable while the service came up looking
# healthy. And the issuer is published in OIDC discovery and embedded in every
# token already issued, so it stays exactly as it is: `auth.quantify.club`,
# reached by that name through the same tunnel.
#
# **Probes that read and do not write.** `/debug/healthz` and `/debug/ready`
# answer without touching identity state. A probe that authenticated, or
# created anything, would make Kubernetes' own liveness checking a source of
# writes to the account store — and a restart loop would then be an
# ever-growing pile of them.
#
# **One replica, for the move.** Zitadel supports more, and adding replicas at
# the same time as changing where it runs is the same mistake as upgrading it.
#
# **A proxy in front of it, because the issuer is built from the request.**
# TLS terminates at Cloudflare, so every hop after it is plain HTTP, and
# Zitadel derives its issuer scheme from `X-Forwarded-Proto`. The ALB sets that
# header itself to `http` — it is an HTTP listener and is telling the truth
# about its own hop — and discovery then published `http://auth.quantify.club`.
# The application verifies `iss` exactly, so every token minted behind that
# would be rejected. Measured, not predicted: through the ALB the cluster
# published `http://`, while production publishes `https://`.
#
# `ZITADEL_EXTERNALSECURE=true` is set here and on EC2 and is not the fix — the
# provider builds the issuer from the request it actually received. What it
# needs is the scheme the *browser* used. Production supplies that with Caddy;
# this is the same two headers, moved into the pod so the Ingress can stay a
# plain HTTP listener and the tunnel path is unchanged.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantify-identity
  namespace: quantify
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantify-identity-proxy
  namespace: quantify
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8081 {
      reverse_proxy localhost:8080 {
        # The two headers that decide what the issuer says. Identical to
        # archive/ec2-deployment/roles/quantify/templates/Caddyfile.j2,
        # the point of this container is to not be a different answer to a
        # problem production already solved.
        header_up X-Forwarded-Proto https
        header_up X-Forwarded-Port 443
      }
      # The three the EC2 identity host carried. Not four: `X-Frame-Options
      # DENY` was on the application host and not this one, and adding it here
      # would be a new decision about whether a login page may be framed,
      # taken during a move, in the file whose whole point is to change
      # nothing.
      # `>` forces a set. Without it Caddy appended to the headers Zitadel
      # already sends, and the response carried two values for each — for
      # Referrer-Policy that was `no-referrer` and `same-origin` together,
      # where the last valid token wins, so Zitadel's value silently overrode
      # the one this block exists to impose. Two identical HSTS values are
      # merely untidy; two conflicting referrer policies is the stricter one
      # not applying.
      header {
        >Strict-Transport-Security "max-age=31536000; includeSubDomains"
        >X-Content-Type-Options nosniff
        >Referrer-Policy no-referrer
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantify-identity
  namespace: quantify
spec:
  replicas: 1
  strategy:
    # Recreate: two Zitadel processes racing to apply the same schema
    # migrations against one database is a way to find out what its migration
    # locking does under load, during a cutover, with real accounts in it.
    type: Recreate
  selector:
    matchLabels: { app: quantify-identity }
  template:
    metadata:
      labels: { app: quantify-identity }
    spec:
      serviceAccountName: quantify-identity
      # The OIDC bootstrap, as a native sidecar rather than a separate Job.
      #
      # It has to run *inside this pod*: FIRSTINSTANCE writes the deploy-bootstrap
      # PAT to the `machinekey` emptyDir, and an emptyDir is not reachable from
      # another pod — so a Job cannot read it, and the image is distroless, so
      # `kubectl exec`/`cp` cannot lift it out either. A native sidecar (an
      # initContainer with `restartPolicy: Always`) starts alongside the main
      # containers, mounts the same emptyDir, and reads the PAT locally — the
      # credential never leaves the pod.
      #
      # No startup or readiness probe, deliberately: a native sidecar with one
      # gates the main containers on it, and this one waits for the main Zitadel
      # container, so a probe here would deadlock the pod. It polls `localhost`
      # instead, and `localhost` is the point — every container in a pod shares
      # the network namespace, so this reaches Zitadel directly and never touches
      # the ALB's `X-Forwarded-Proto: http`.
      #
      # Idempotent by search (see bootstrap_identity.py), so it re-adopts the
      # project, app and user on every restart rather than making a second of
      # each; the client id it prints is the same one already in Secrets Manager.
      # It emits only that client id — a public identifier, not a secret — and
      # then idles, because a native sidecar is expected to stay up for the pod.
      initContainers:
        - name: bootstrap
          image: public.ecr.aws/docker/library/python:3.12-slim
          restartPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "bootstrap: waiting for zitadel on localhost:8080"
              until python3 -c 'import urllib.request; urllib.request.urlopen("http://localhost:8080/debug/ready", timeout=3)' 2>/dev/null; do
                sleep 5
              done
              echo "bootstrap: zitadel is ready, minting the OIDC application"
              python3 /bootstrap/bootstrap_identity.py \
                --url http://localhost:8080 \
                --identity-host "$IDENTITY_HOST" \
                --pat-file /machinekey/pat.txt \
                --app-origin "$APP_ORIGIN" \
                --test-email "$TEST_EMAIL" \
                --test-password "$TEST_PASSWORD" >/tmp/cid 2>/tmp/err
              rc=$?
              cat /tmp/err >&2
              if [ "$rc" = "0" ]; then
                echo "OIDC_CLIENT_ID=$(cat /tmp/cid)"
              else
                echo "bootstrap: FAILED rc=$rc"
              fi
              # Stay up: a native sidecar that exits is a restart, and a restart
              # loop would re-run the bootstrap every few seconds.
              exec sleep infinity
          env:
            # This deployment's fixed identities. The issuer host the token
            # carries, the origin the OIDC redirect returns to, and a
            # pre-verified test user for the ui-agent runs — a test default, as
            # asked, not a real account.
            - { name: IDENTITY_HOST,  value: "auth.quantify.club" }
            - { name: APP_ORIGIN,     value: "https://quantify.club" }
            - { name: TEST_EMAIL,     value: "pilot@quantify.club" }
            - { name: TEST_PASSWORD,  value: "Quantify-Pilot-2026!" }
          volumeMounts:
            - { name: machinekey,       mountPath: /machinekey, readOnly: true }
            - { name: bootstrap-script, mountPath: /bootstrap,  readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      containers:
        - name: identity
          image: ghcr.io/zitadel/zitadel:v2.65.1
          # `start-from-init`, not `start`: on a fresh database there is no
          # instance to start, so the process must init and run setup first —
          # which is also where the FIRSTINSTANCE config creates the org, the
          # admin, and the machine user whose PAT the OIDC bootstrap uses.
          # Idempotent on an already-initialised database (setup skips applied
          # steps), so this is safe on a redeploy and on the move-a-restored-DB
          # path the rest of this file was written for.
          args: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "external"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: quantify-identity }
          volumeMounts:
            # Zitadel writes the deploy-bootstrap machine user's PAT here at
            # first setup (FIRSTINSTANCE_PATPATH). emptyDir, because it is needed
            # once, in this pod's lifetime, to mint the OIDC application — after
            # which the client id lives in Secrets Manager and nothing reads it.
            - name: machinekey
              mountPath: /machinekey
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /debug/ready, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /debug/healthz, port: 8080 }
            # Generous, and it has to be: on a fresh database `start-from-init`
            # runs the *entire* migration set plus FIRSTINSTANCE before the port
            # opens, and on db.t4g.micro that ran past 120s. The probe then began
            # killing the pod mid-migration, and because a migration step records
            # "started" before "done", each kill left a lock the next pod waited
            # on forever ("migration already started"). Measured, not predicted —
            # it deadlocked on step 01_tables and never recovered. 360s covers a
            # cold first setup; a steady-state restart re-opens the port in
            # seconds because setup skips completed steps, so the long delay costs
            # nothing after the first bring-up.
            initialDelaySeconds: 360
            periodSeconds: 30
        - name: proxy
          image: public.ecr.aws/docker/library/caddy:2.8-alpine
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/caddy
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            # Through the proxy, so readiness means the path traffic actually
            # takes is working — not that two containers are separately alive
            # while nothing joins them.
            httpGet: { path: /debug/ready, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: proxy-config
          configMap: { name: quantify-identity-proxy }
        - name: machinekey
          emptyDir: {}
        # The bootstrap script, mounted from a ConfigMap the deploy renders from
        # scripts/bootstrap_identity.py so the file has one source of truth.
        - name: bootstrap-script
          configMap: { name: quantify-identity-bootstrap }
---
apiVersion: v1
kind: Service
metadata:
  name: quantify-identity
  namespace: quantify
spec:
  type: ClusterIP
  selector: { app: quantify-identity }
  ports:
    - port: 80
      # 8081, not 8080: everything reaching Zitadel from outside the pod goes
      # through the proxy, so nothing can arrive with the ALB's own
      # `X-Forwarded-Proto: http` still on it.
      targetPort: 8081
