# quantify-web: the product surface.
#
# It talks to PostgreSQL, to the identity provider, and — once the cutover is
# made — to quantify-evaluate rather than evaluating in-process. Until then it
# carries the in-process path too, which is why it holds a database credential
# and quantify-evaluate does not.
#
# **Its secrets come from Secrets Manager via the playbook**, never from a file
# in the repository and never from a terraform output written to disk. The
# playbook fetches each with `no_log` and writes one Kubernetes Secret.
#
# **Reachable only through the Ingress.** The Service is ClusterIP; what makes
# it public is `ingress.yaml`, which is a separate object so that "this is on
# the internet" is a decision somebody makes in one obvious place.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantify-web
  namespace: quantify
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantify-web
  namespace: quantify
spec:
  replicas: 2
  selector:
    matchLabels: { app: quantify-web }
  template:
    metadata:
      labels: { app: quantify-web }
      annotations:
        # The init container spends ~5 minutes building the dashboard from the
        # day's history. EKS Auto Mode's node consolidation was evicting the pod
        # mid-build ("Underutilized"), so it restarted from scratch and never
        # finished. This tells the autoscaler to leave a running pod in place.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: quantify-web
      volumes:
        # The research dashboard is data, rebuilt from the day's market history
        # rather than shipped in the image. The init container writes it here and
        # the web container serves it from the same empty dir, so no shared
        # volume is needed and each pod carries a dashboard current as of its own
        # start. `research-refresh` (a CronJob) rolls the deployment daily to
        # rebuild it.
        - name: research
          emptyDir: {}
        # The daily-refreshed vendor snapshot manifest. Mounted read-only from a
        # ConfigMap the refresh-pilot-snapshot workflow rewrites each day;
        # `approved_snapshot` re-reads it per request (no memoization), so a fresh
        # pin is picked up live without a pod roll. The pilot's inline evaluation
        # reads it via QUANTIFY_VENDOR_MANIFEST below. Not `optional`: a vendor
        # deployment whose manifest is missing resolves no snapshot and serves
        # nothing, so refusing to start is better than serving empty.
        - name: vendor-manifest
          configMap:
            name: quantify-vendor-manifest
      initContainers:
        - name: build-dashboard
          image: IMAGE_PLACEHOLDER
          # Best-effort: `exit 0` whatever happens, so a transient data-vendor
          # failure leaves the page showing its "not built yet" placeholder
          # rather than holding the whole pod — which also serves the workspace
          # and the API — out of the rotation.
          command: ["sh", "-lc"]
          args:
            - |
              END=$(date +%Y-%m-%d)
              echo "building the research dashboard through $END"
              python3 -m src.history --start 2016-01-01 --end "$END" --refresh \
                && python3 -m src.visualization.bokeh_app \
                     --output /srv/research/regime_dashboard.html \
                && echo "dashboard built" \
                || echo "dashboard build failed; /research keeps its placeholder"
              exit 0
          env:
            - name: QUANTIFY_RESEARCH_DIR
              value: /srv/research
          resources:
            # Bounded by the web container's own limit, so scheduling reserves
            # max(init, web) = 4Gi and this adds nothing to the footprint.
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - name: research
              mountPath: /srv/research
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          command: ["uvicorn", "src.api:create_app", "--factory",
                    "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: quantify-web }
          env:
            # Where evaluation will come from after the cutover. Present now
            # and unused, so the switch is a code path rather than a redeploy.
            - name: QUANTIFY_EVALUATE_URL
              value: http://quantify-evaluate
            # The deterministic syntax witness, declared here as well as in
            # the image so a manifest reader can see which profile this
            # deployment serves without opening the Dockerfile.
            #
            # It is a declaration, not a detection: `_declared_profile` reads
            # it rather than checking whether Stanza imported, because
            # MODEL_ONLY and BOTH are claims a plan carries for its whole life.
            # The preflight refuses to serve if this says `yes` and the parser
            # cannot be loaded, so the claim and the capability cannot drift.
            - name: QUANTIFY_SYNTAX_WITNESS
              value: "yes"
            - name: QUANTIFY_BUILD_COMMIT
              value: "COMMIT_PLACEHOLDER"
            - name: QUANTIFY_IMAGE_DIGEST
              value: "DIGEST_PLACEHOLDER"
            # Serve the dashboard the init container built, from the shared dir.
            - name: QUANTIFY_RESEARCH_DIR
              value: /srv/research
            # Read the vendor manifest from the mounted ConfigMap rather than the
            # image's committed default, so the daily refresh can re-pin it without
            # a rebuild (the QUANTIFY_VENDOR_MANIFEST seam in market_data/access).
            - name: QUANTIFY_VENDOR_MANIFEST
              value: /etc/quantify/vendor/manifest.yaml
          volumeMounts:
            - name: research
              mountPath: /srv/research
            - name: vendor-manifest
              mountPath: /etc/quantify/vendor
              readOnly: true
          resources:
            # Raised for the syntax witness. The Stanza pipeline is loaded
            # once per process and holds its model resident; the API alone ran
            # in 1Gi and a parser on top of it did not.
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 4Gi }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            # The preflight loads the declared parser before reporting ready,
            # so first start is seconds rather than milliseconds. A probe that
            # gave up sooner would restart the pod for doing what it was told.
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quantify-web
  namespace: quantify
spec:
  type: ClusterIP
  selector: { app: quantify-web }
  ports:
    - port: 80
      targetPort: 8000
