# What is on the internet, in one file.
#
# Auto Mode's load-balancer integration provisions an ALB from these objects.
# The Cloudflare tunnel is then repointed at that ALB in terraform — the tunnel
# config already names `aws_lb.main.dns_name`, so the cutover is a change of
# which load balancer it addresses rather than a new network path.
#
# **Two hostnames, two backends.** The application and the identity provider
# are reached by different names on purpose: Zitadel publishes its issuer in
# OIDC discovery, and an issuer must be a hostname it is actually reached by.
# Serving it on a path under the application's name would make every token it
# signs verify against a URL nobody can reach it at.
#
# **Two Ingress objects, and therefore two load balancers.** Auto Mode's
# controller does not implement `alb.ingress.kubernetes.io/group.name` — that
# belongs to the standalone AWS Load Balancer Controller — so there is no way
# to merge these into one ALB. Measured, not assumed: both reconciled
# successfully and reported different hostnames.
#
# They would have been split anyway. Health-check settings are per-Ingress and
# these two have nothing in common: `quantify-web` answers `/health/live`,
# Zitadel answers `/debug/healthz`, and one shared path would mean the ALB
# deciding a healthy identity provider was down, on a rule the application
# defined.
#
# **Only quantify-web and identity appear here.** quantify-data and
# quantify-evaluate are deliberately absent: they are ClusterIP with no
# Ingress, and their acceptance evidence is that external traffic cannot reach
# them. Adding them here would be the fastest way to undo the whole boundary.
---
# Auto Mode ships the controller but no IngressClass — unlike the storage case,
# where it ships a StorageClass that happens to be unusable. Nothing here is
# defaulted, so this is declared rather than assumed.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: quantify
spec:
  scheme: internal
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: quantify
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantify-web
  namespace: quantify
  annotations:
    # Internal: the tunnel reaches it from inside the VPC, exactly as it
    # reaches the current ALB. An internet-facing scheme would put the
    # application on the public internet beside the tunnel rather than behind
    # it, which is a second front door nobody asked for.
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health/live
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # The bare root, sent to the product. Caddy did this with `redir /
    # /workspace/ 302` and the reason is in its comment: the root returns the
    # API's service metadata, so the first thing a pilot invitee saw was a
    # document describing the service rather than a way in. Verified to have
    # regressed the moment the tunnel moved — the apex answered 200 with that
    # JSON.
    #
    # Exact, so only `/` moves. `/info`, `/health*` and `/docs` still answer as
    # themselves.
    #
    # `Protocol` and `Port` are named rather than defaulted. Left out, the ALB
    # fills them from the hop it is on — which is plain HTTP on port 80 — and
    # the redirect came back as `http://quantify.club:80/workspace/`, sending
    # every arriving browser down a scheme downgrade on the way to the login
    # page. Observed after applying it, which is why it is written down here.
    # Sends the bare root to the research dashboard — the graphs are the front
    # door now. It used to land on /workspace/; the daily Bokeh dashboard is the
    # first thing a visitor should see, and the "try your own strategy" prompt at
    # the bottom of it is the way in to the workspace. The app itself also sends
    # a browser from / to /research (content-negotiated, so an API client at the
    # root still gets JSON); this is the belt at the edge so it holds even for a
    # client the negotiation would not catch.
    alb.ingress.kubernetes.io/actions.redirect-workspace: >
      {"type":"redirect","redirectConfig":{"Path":"/research","Port":"443",
       "Protocol":"HTTPS","Query":"#{query}","StatusCode":"HTTP_302"}}
    # `www`, redirected rather than served — the job Caddy did on EC2, and it
    # has to be done by something. PUBLIC_BASE_URL and the registered OIDC
    # redirect URI are both the apex, so somebody signing in from `www` would
    # be returned to a hostname their session is not on. The application does
    # not redirect it (nothing in `src/` mentions the name), so serving `www`
    # from the same backend would produce a login that silently fails to stick.
    alb.ingress.kubernetes.io/actions.redirect-apex: >
      {"type":"redirect","redirectConfig":{"Host":"__WEB_HOST__","Path":"/#{path}",
       "Port":"443","Protocol":"HTTPS","Query":"#{query}","StatusCode":"HTTP_301"}}
spec:
  ingressClassName: alb
  rules:
    - host: __WEB_HOST__
      http:
        paths:
          # First, so the exact root matches before the catch-all prefix does.
          - path: /
            pathType: Exact
            backend:
              service:
                name: redirect-workspace
                port: { name: use-annotation }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantify-web
                port: { number: 80 }
    - host: www.__WEB_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-apex
                port: { name: use-annotation }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantify-identity
  namespace: quantify
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    # Zitadel's own health endpoint, and the same one the pod's liveness probe
    # uses. It reads and does not write — a load balancer health check runs
    # every few seconds forever, and one that touched identity state would be a
    # permanent write load on the account store.
    alb.ingress.kubernetes.io/healthcheck-path: /debug/healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - host: __IDENTITY_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantify-identity
                port: { number: 80 }
