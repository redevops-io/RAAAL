# The simplest shape that satisfies the pilot's requirements.
#
#   one application container + managed PostgreSQL + managed secrets + TLS
#
# Deliberately not Kubernetes, not multi-node, not the PostgreSQL extension.
# A closed pilot of five to ten people needs none of it, and every component
# added here is one an operator must understand before they can restore a
# backup at three in the morning.
#
# `database` is included for a self-hosted first deployment. On AWS, drop that
# service, point QUANTIFY_DATABASE_URL at RDS, and let RDS own backups — the
# retention settings below are the minimum this pilot needs and a managed
# service does them better.
#
#   docker compose -f deploy/docker-compose.production.yml --env-file .env up -d
#
# Startup refusals are expected behaviour, not failures to work around. See
# docs/Runbook.md § Startup refusals.

services:
  api:
    image: ${QUANTIFY_IMAGE:-quantify-api:latest}
    restart: unless-stopped
    # The factory, not the module-level app. The preflight runs while the
    # process is starting, so a refusal prevents the socket ever opening —
    # rather than a lifespan hook firing after it is already accepting.
    command: ["uvicorn", "src.api:create_app", "--factory",
              "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      # Telemetry only. Losing this volume costs traces and no financial
      # artifact — that property is tested, not assumed.
      - trace:/var/lib/quantify
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # `/health/ready` is 503 until the preflight passes: migration mismatch,
      # schema drift and an unreachable database all keep it unready while
      # staying diagnosable. `/health/live` would report a refusing instance as
      # healthy, which is the distinction the two endpoints exist for.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;
              sys.exit(0 if urllib.request.urlopen(
                'http://localhost:8000/health/ready', timeout=5).status == 200
                else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-quantify}
    volumes:
      - database:/var/lib/postgresql/data
    # Not published. Only the application network reaches it.
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TLS terminates here. Bring your own certificate management; the pilot
  # handles no plaintext HTTP from the public internet.
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]

volumes:
  database:
  trace:
  caddy-data:
  caddy-config:
