spec_version: '0.1'
name: us-federal
version: 1
title: US federal contribution limits by account kind and year
jurisdiction: US-federal

source: >-
  IRS annual cost-of-living adjustments to dollar limitations on benefits and
  contributions (the notice issued each autumn for the following tax year), and
  IRS Publication 590-A for IRA limits.

rationale: >-
  These are the figures that decide whether a stated plan is legal, so they live
  here rather than in code for the same reason the statistical thresholds do:
  they change every year, a change produces a new version, and a new version does
  not retroactively re-judge results that cite version 1.

  A wrong limit is not a cosmetic defect. Enforcing $7,000 where the true figure
  is $7,500 silently refuses a contribution the user is entitled to make, and the
  resulting balance is wrong for every subsequent year. That is why each figure
  carries its own verification state instead of being trusted because it is
  written down.

# --- Verification --------------------------------------------------------
#
# `verified_against_source: false` means the figure was transcribed from a
# secondary recollection and has NOT been checked against the IRS notice named
# above. Enforcement still runs — the mechanism is real and tested — but any
# account whose governing limit is unverified reports its contribution rule as
# PARTIAL rather than ENFORCED, and the unverified figure is named in the
# result's modelling scope.
#
# Flip a figure to true only after reading it off the primary source. Do not
# flip the whole file at once; the flags are per-year on purpose, because the
# current year is the one most likely to be wrong and the one most likely to be
# assumed correct.
verified_against_source: false

limits:

  # Employee elective deferral into an employer plan. Shared across the
  # traditional and Roth halves of the same plan — see SHARES_DEFERRAL_LIMIT in
  # src/runtime/account.py. Listed once per year, not once per half.
  employee_deferral:
    applies_to: [TRADITIONAL_401K, ROTH_401K]
    shared_across_applies_to: true
    by_year:
      2024: {amount: 23000, catch_up_50: 7500, verified_against_source: false}
      2025: {amount: 23500, catch_up_50: 7500, catch_up_60_63: 11250,
             verified_against_source: false}
      2026: {amount: 24500, catch_up_50: 8000, verified_against_source: false}

  # IRA limit, shared across every IRA a person holds — a Roth IRA and a
  # traditional IRA do not each get the full amount.
  ira_contribution:
    applies_to: [ROTH_IRA, TRADITIONAL_IRA]
    shared_across_applies_to: true
    by_year:
      2024: {amount: 7000, catch_up_50: 1000, verified_against_source: false}
      2025: {amount: 7000, catch_up_50: 1000, verified_against_source: false}
      2026: {amount: 7500, catch_up_50: 1100, verified_against_source: false}

# Account kinds with no federal contribution limit expressible here. Listed
# explicitly so that "no limit found" and "not yet entered" are different
# answers: an account absent from both lists is a gap, not a green light.
unlimited:
  - TAXABLE

not_yet_entered:
  - HSA
  - PLAN_529
  - TRUST
